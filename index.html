<style>
/* ===================== DESIGN TOKENS (clean, claro, alto contraste) ===================== */
:root{
  --brand:#1b3a5b; --brand-dark:#0f2740; --brand-soft:#e7eef6;
  --bg:#f5f7fa; --card:#ffffff; --line:#dbe3ec;
  --ink:#0f2740; --muted:#54637a; --danger:#c0392b; --warn:#d9822b; --ok:#1e874b;
  --accent-n:#2d6cdf; --accent-p:#8e44ad; --accent-k:#e08e0b;
  --r:14px; --sh:0 2px 10px rgba(16,40,33,.06); --sh2:0 6px 24px rgba(16,40,33,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; -webkit-text-size-adjust:100%;}
h1,h2,h3{margin:0 0 .4em}
a{color:var(--brand-dark)}
button{font:inherit; cursor:pointer}
input,select,textarea{font:inherit; width:100%; padding:12px 14px; border:1px solid var(--line);
  border-radius:10px; background:#fff; color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand); border-color:var(--brand)}
label{display:block; font-weight:600; font-size:.9rem; margin:10px 0 4px; color:var(--ink)}
.hint{color:var(--muted); font-size:.82rem; margin-top:4px}

/* Layout */
.app{max-width:820px; margin:0 auto; padding:0 14px 96px}
.topbar{position:sticky; top:0; z-index:30; background:var(--brand);
  color:#fff; padding:12px 14px; display:flex; align-items:center; gap:10px;
  box-shadow:var(--sh); padding-top:calc(12px + env(safe-area-inset-top))}
.topbar .logo{font-weight:800; letter-spacing:.3px; font-size:1.05rem; flex:1}
.topbar .pill{background:rgba(255,255,255,.18); padding:4px 10px; border-radius:999px; font-size:.78rem}
.topbar button{background:rgba(255,255,255,.15); color:#fff; border:0; padding:8px 12px; border-radius:10px}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--sh); padding:16px; margin:14px 0}
.card h2{font-size:1.1rem}
.section-title{font-size:.78rem; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:18px 2px 6px}

.btn{background:var(--brand); color:#fff; border:0; padding:13px 16px; border-radius:11px;
  font-weight:700; width:100%; box-shadow:var(--sh)}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:#fff; color:var(--brand-dark); border:1.5px solid var(--brand)}
.btn.ghost{background:transparent; color:var(--brand-dark); box-shadow:none; border:1px dashed var(--line)}
.btn.danger{background:var(--danger)}
.btn.small{width:auto; padding:9px 12px; font-size:.85rem; border-radius:9px}
.row{display:flex; gap:10px; flex-wrap:wrap}
.row > *{flex:1; min-width:0}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

.badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:.74rem; font-weight:700}
.badge.ok{background:#e2f3ea; color:var(--ok)} .badge.warn{background:#fbeede; color:var(--warn)}
.badge.dang{background:#fbe4e0; color:var(--danger)} .badge.n{background:#e7effc;color:var(--accent-n)}
.badge.p{background:#f1e7fa;color:var(--accent-p)} .badge.k{background:#fcf1dc;color:var(--accent-k)}

.list{display:flex; flex-direction:column; gap:8px}
.item{border:1px solid var(--line); border-radius:12px; padding:12px; background:#fff;
  display:flex; align-items:center; gap:10px}
.item .grow{flex:1; min-width:0}
.item .title{font-weight:700}
.item .sub{color:var(--muted); font-size:.85rem}

.check{display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--line);
  border-radius:10px; background:#fff; margin:6px 0}
.check input{width:20px; height:20px; flex:0 0 auto; margin-top:2px}
.check .lbl{flex:1}

.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{padding:8px 12px; border-radius:999px; border:1.5px solid var(--line); background:#fff;
  font-size:.85rem; font-weight:600}
.chip.on{background:var(--brand-soft); border-color:var(--brand); color:var(--brand-dark)}

.hidden{display:none !important}
.center{text-align:center}
.spacer{height:8px}
.divider{height:1px; background:var(--line); margin:14px 0}

/* KPIs */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.kpi{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; box-shadow:var(--sh)}
.kpi .v{font-size:1.6rem; font-weight:800; color:var(--brand-dark)}
.kpi .l{color:var(--muted); font-size:.82rem; margin-top:2px}
.kpi .d{font-size:.78rem; margin-top:4px}

table{width:100%; border-collapse:collapse; font-size:.88rem}
th,td{text-align:left; padding:9px 8px; border-bottom:1px solid var(--line)}
th{color:var(--muted); font-weight:700; font-size:.78rem; text-transform:uppercase; letter-spacing:.4px}
.tablewrap{overflow-x:auto}

/* Toast */
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background:#12261f; color:#fff; padding:12px 18px; border-radius:12px; box-shadow:var(--sh2);
  z-index:100; font-size:.9rem; max-width:90%; opacity:0; pointer-events:none; transition:.25s}
.toast.show{opacity:1}
.toast.err{background:var(--danger)} .toast.ok{background:var(--ok)}

/* Offline banner */
.offline{position:fixed; top:0; left:0; right:0; background:var(--warn); color:#fff;
  text-align:center; padding:6px; font-size:.82rem; z-index:200}

/* Loading */
.loader{display:inline-block; width:18px; height:18px; border:3px solid rgba(255,255,255,.4);
  border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; vertical-align:-3px}
.loader.dark{border-color:var(--line); border-top-color:var(--brand)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Bottom nav (consultor) */
.bottomnav{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line);
  display:flex; z-index:25; padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{flex:1; background:none; border:0; padding:10px 4px; color:var(--muted); font-size:.72rem;
  font-weight:600; display:flex; flex-direction:column; align-items:center; gap:3px}
.bottomnav button.on{color:var(--brand-dark)}
.bottomnav .ic{font-size:1.3rem; line-height:1}

.subblock{border:1px solid var(--line); border-radius:12px; padding:12px; margin:10px 0; background:#fbfdfc}
.nutri-line{display:grid; grid-template-columns:1fr 90px 34px; gap:8px; align-items:center; margin:6px 0}
.npk-summary{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px}
.npk-box{border:1px solid var(--line); border-radius:10px; padding:10px; text-align:center; background:#fff}
.npk-box .v{font-weight:800; font-size:1.15rem}
.photo{position:relative; border:1px solid var(--line); border-radius:10px; overflow:hidden}
.photo img{width:100%; display:block; aspect-ratio:4/3; object-fit:cover}
.photo .meta{font-size:.72rem; color:var(--muted); padding:6px 8px}
.photogrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px}
.fab{position:fixed; right:16px; bottom:80px; z-index:26; width:auto}

.filters{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.chartbox{position:relative; height:240px}
</style>

<script>

const $ = (s,el=document)=>el.querySelector(s);

/* ---------- util ---------- */
function toast(msg,type=""){const t=$("#toast"); t.className="toast show "+type; t.textContent=msg;
  setTimeout(()=>t.className="toast",2600);}
function fmtDate(d){ if(!d) return "—"; const x=new Date(d);
  return x.toLocaleDateString("pt-BR")+" "+x.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}
function fmtDay(d){ if(!d) return "—"; return new Date(d).toLocaleDateString("pt-BR");}
function norm(s){ return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^A-Za-z0-9]/g,"").replace(/\b\w/g,c=>c.toUpperCase()).replace(/[^A-Za-z0-9]/g,"");}
function camel(s){ // token normalizado p/ nome de arquivo (sem acento/espaço/símbolo)
  return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join("").replace(/[^A-Za-z0-9]/g,"");}
function num(v){ const n=parseFloat(String(v).replace(",",".")); return isFinite(n)?n:0; }
async function guard(fn){ try{ return await fn(); }catch(e){ console.error(e);
  toast(e.message||"Erro inesperado","err"); throw e; } }
/* Converte File (foto) em dataURL base64 — usado para embutir no PDF SEM subir ao Supabase */
function fileToDataURL(file){
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
}
/* Redimensiona a imagem (largura máx) e devolve dataURL + dimensões, para caber no PDF */
function shrinkImage(dataUrl,maxW=1000,quality=0.72){
  return new Promise(res=>{ const img=new Image();
    img.onload=()=>{ const scale=Math.min(1,maxW/img.width);
      const c=document.createElement("canvas"); c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res({url:c.toDataURL("image/jpeg",quality), w:c.width, h:c.height}); };
    img.onerror=()=>res(null); img.src=dataUrl; });
}
/* Carrega dataURL de um logo e devolve {url,w,h} para o jsPDF */
function loadImageMeta(dataUrl){
  return new Promise(res=>{ if(!dataUrl) return res(null); const img=new Image();
    img.onload=()=>res({url:dataUrl, w:img.width, h:img.height});
    img.onerror=()=>res(null); img.src=dataUrl; });
}

/* ---------- offline detection ---------- */
function updateNet(){ $("#offlineBanner").classList.toggle("hidden", navigator.onLine); }
window.addEventListener("online",updateNet); window.addEventListener("offline",updateNet); updateNet();


/* =====================================================================
   AUTENTICAÇÃO E ROTEAMENTO POR PERFIL
   ===================================================================== */
async function initAuth(){
  if(!sb){ renderConfigMissing(); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await loadProfileAndRoute(); }
  else { renderLogin(); }
  sb.auth.onAuthStateChange((_e,s)=>{ if(!s) renderLogin(); });
}

function renderConfigMissing(){
  root.innerHTML = `<div class="app"><div class="card">
    <h2>⚙️ Configuração pendente</h2>
    <p>Preencha <code>SUPABASE_URL</code> e <code>SUPABASE_ANON_KEY</code> no topo do arquivo
    (ou via variáveis de ambiente no deploy) para conectar ao Supabase.</p>
    <p class="hint">A chave <b>anon/public</b> é a única que vai no front-end. A
    <b>service_role</b> nunca deve aparecer aqui.</p></div></div>`;
}

function renderLogin(){
  state.user=null; state.profile=null;
  root.innerHTML = `
  <div class="app">
    <div style="height:34px"></div>
    <div class="center">
      <div style="font-size:2.2rem">🌱</div>
      <h1 style="color:var(--brand-dark);margin-top:12px">Projeto Suporte Técnico</h1>
      <p class="hint">Cafeicultura (arábica e conilon)</p></div>
    <div class="card">
      <div class="chips" style="margin-bottom:12px">
        <button class="chip on" id="tabLogin">Entrar</button>
        <button class="chip" id="tabSignup">Criar conta</button>
      </div>
      <div id="formLogin">
        <label>E-mail</label><input id="li_email" type="email" autocomplete="email" placeholder="voce@empresa.com.br"/>
        <label>Senha</label><input id="li_pass" type="password" autocomplete="current-password" placeholder="••••••••"/>
        <div class="spacer"></div>
        <button class="btn" id="btnLogin">Entrar</button>
        <div class="spacer"></div>
        <button class="btn ghost small" id="btnReset" style="width:100%">Esqueci minha senha</button>
      </div>
      <div id="formSignup" class="hidden">
        <label>Nome completo</label><input id="su_nome" placeholder="Seu nome"/>
        <label>E-mail</label><input id="su_email" type="email" placeholder="voce@empresa.com.br"/>
        <label>Senha (mín. 6 caracteres)</label><input id="su_pass" type="password" placeholder="••••••••"/>
        <div class="spacer"></div>
        <button class="btn" id="btnSignup">Criar conta</button>
        <p class="hint">Consultores já cadastrados na base são aprovados automaticamente.
        Novos usuários ficam <b>pendentes</b> até a autorização do administrador.</p>
      </div>
    </div>
  </div>`;
  $("#tabLogin").onclick=()=>{$("#tabLogin").classList.add("on");$("#tabSignup").classList.remove("on");
    $("#formLogin").classList.remove("hidden");$("#formSignup").classList.add("hidden");};
  $("#tabSignup").onclick=()=>{$("#tabSignup").classList.add("on");$("#tabLogin").classList.remove("on");
    $("#formSignup").classList.remove("hidden");$("#formLogin").classList.add("hidden");};
  $("#btnLogin").onclick=doLogin; $("#btnSignup").onclick=doSignup; $("#btnReset").onclick=doReset;
  $("#li_pass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
}

async function doLogin(){
  const email=$("#li_email").value.trim().toLowerCase(), pass=$("#li_pass").value;
  if(!email||!pass) return toast("Informe e-mail e senha","err");
  const b=$("#btnLogin"); b.innerHTML='<span class="loader"></span> Entrando…'; b.disabled=true;
  const { error } = await sb.auth.signInWithPassword({email, password:pass});
  b.disabled=false; b.textContent="Entrar";
  if(error) return toast(error.message,"err");
  await loadProfileAndRoute();
}
async function doSignup(){
  const nome=$("#su_nome").value.trim(), email=$("#su_email").value.trim().toLowerCase(), pass=$("#su_pass").value;
  if(!nome||!email||pass.length<6) return toast("Preencha nome, e-mail e senha (6+)","err");
  const b=$("#btnSignup"); b.innerHTML='<span class="loader"></span> Criando…'; b.disabled=true;
  const { error } = await sb.auth.signUp({email, password:pass, options:{data:{nome}}});
  b.disabled=false; b.textContent="Criar conta";
  if(error) return toast(error.message,"err");
  toast("Conta criada! Verifique seu e-mail se a confirmação estiver ativa.","ok");
}
async function doReset(){
  const email=$("#li_email").value.trim().toLowerCase();
  if(!email) return toast("Digite seu e-mail no campo acima primeiro","err");
  const { error } = await sb.auth.resetPasswordForEmail(email);
  toast(error? error.message : "Enviamos um link de redefinição para seu e-mail.", error?"err":"ok");
}

async function loadProfileAndRoute(){
  const { data:{ user } } = await sb.auth.getUser(); state.user=user;
  let { data:prof } = await sb.from("consultores").select("*").eq("id",user.id).maybeSingle();
  // fallback: aguarda trigger provisionar
  if(!prof){ await new Promise(r=>setTimeout(r,800));
    ({ data:prof } = await sb.from("consultores").select("*").eq("id",user.id).maybeSingle()); }
  state.profile=prof;
  if(!prof){ return renderPending("Seu perfil está sendo provisionado. Recarregue em instantes."); }
  if(prof.status==="bloqueado") return renderPending("Seu acesso foi bloqueado pelo administrador.");
  if(prof.status==="pendente")  return renderPending("Seu cadastro aguarda aprovação do administrador.");
  await loadCatalogos();
  if(prof.role==="admin") renderAdmin();
  else renderConsultorHome();
}

}

}

      <button class="btn secondary" onclick="viewFazendas()" style="margin-top:8px">Cancelar</button>
      <p class="hint">A fazenda aparecerá para você como <b>“Produtor - Fazenda”</b> e será vinculada
      automaticamente à sua conta.</p>
    </div>`;
  $("#nf_save").onclick=async()=>guard(async()=>{
    const produtor=$("#nf_prod").value.trim().toUpperCase(), fazenda=$("#nf_faz").value.trim().toUpperCase();
    if(!produtor||!fazenda) return toast("Informe produtor e fazenda","err");
    const b=$("#nf_save"); b.innerHTML='<span class="loader"></span> Salvando…'; b.disabled=true;
    const { data, error } = await sb.from("fazendas").insert({
      produtor, fazenda, cidade:$("#nf_cid").value.trim()||null, estado:$("#nf_uf").value.trim().toUpperCase()||null,
      created_by:state.user.id
    }).select().single();

}

async function selFazenda(f){
  state.fazenda=f;
  const w=$("#cwrap"); w.innerHTML=`<div class="center" style="padding:30px"><span class="loader dark"></span></div>`;
  const { data:talhoes } = await sb.from("talhoes").select("*").eq("fazenda_id",f.id).order("nome");
  w.innerHTML = `
    <button class="btn ghost small" onclick="viewFazendas()">← Fazendas</button>
    <div class="card">
      <h2>${f.display_nome}</h2>
      <div class="sub hint">${f.cidade||""} ${f.estado?"· "+f.estado:""} ${f.cafeeira?"· "+f.cafeeira:""}</div>
    </div>
    <div class="section-title">Talhões</div>
    <div class="list" id="talhaoList"></div>
    <div class="spacer"></div>
    <button class="btn ghost" onclick="talhaoForm()">➕ Cadastrar talhão</button>
  `;
  const renderT=(list)=> $("#talhaoList").innerHTML = list.length? list.map(t=>`
      <div class="item">
        <div class="grow"><div class="title">${t.nome}</div>
          <div class="sub">${t.area_ha} ha</div></div>
        <button class="btn small secondary" onclick='talhaoForm(${JSON.stringify(t)})'>✏️</button>
        <button class="btn small danger" onclick="delTalhao('${t.id}')">🗑</button>
        <button class="btn small" onclick='iniciarVisita(${JSON.stringify(t)})'>Visitar</button>
      </div>`).join("")
    : `<p class="hint">Nenhum talhão. Cadastre ao menos um para iniciar a visita.</p>`;
  renderT(talhoes||[]);
  state._reloadTalhoes=async()=>{ const {data}=await sb.from("talhoes").select("*")
    .eq("fazenda_id",f.id).order("nome"); renderT(data||[]); };
}

function talhaoForm(t=null){
  const edit=!!t;
  const w=$("#cwrap");
  const back=w.innerHTML; state._talhaoBack=back;
  w.insertAdjacentHTML("afterbegin",`<div class="card" id="talhaoCard">
    <h2>${edit?"Editar":"Novo"} talhão</h2>
    <label>Nome / identificação</label><input id="t_nome" value="${edit?t.nome:''}" placeholder="Ex.: Talhão 1 - Conilon"/>
    <label>Área (ha) *</label><input id="t_area" type="number" step="0.01" min="0.01" value="${edit?t.area_ha:''}" placeholder="Ex.: 3.50"/>
    <p class="hint">A área é obrigatória e permite calcular NPK também em kg totais no dashboard.</p>
    <div class="spacer"></div>
    <button class="btn" id="t_save">${edit?"Salvar alterações":"Cadastrar"}</button>
    <button class="btn secondary" onclick="selFazenda(state.fazenda)" style="margin-top:8px">Cancelar</button>
  </div>`);
  $("#t_save").onclick=async()=>guard(async()=>{
    const nome=$("#t_nome").value.trim(), area=num($("#t_area").value);
    if(!nome) return toast("Informe o nome do talhão","err");
    if(area<=0) return toast("Área (ha) é obrigatória e deve ser > 0","err");
    const payload={fazenda_id:state.fazenda.id, nome, area_ha:area, criado_por:state.user.id};
    const q = edit ? sb.from("talhoes").update({nome,area_ha:area}).eq("id",t.id)
                   : sb.from("talhoes").insert(payload);
    const { error } = await q;
    if(error) return toast(error.message,"err");
    toast(edit?"Talhão atualizado":"Talhão cadastrado","ok"); selFazenda(state.fazenda);
  });
}
async function delTalhao(id){
  if(!confirm("Excluir este talhão? Visitas já registradas são mantidas.")) return;
  const { error } = await sb.from("talhoes").delete().eq("id",id);
  if(error) return toast(error.message,"err");
  toast("Talhão excluído","ok"); selFazenda(state.fazenda);
}
function setTab(t){ state.tab=t; const nav=$(".bottomnav");
  if(nav){ $$(".bottomnav button").forEach((b,i)=>b.classList.toggle("on",
    (t==='visita'&&i===0)||(t==='hist'&&i===1))); } }

/* Converte ISO -> valor para input datetime-local (fuso local) */
function toLocalInput(iso){
  const d=new Date(iso); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}
/* Renderiza o bloco de continuidade a partir de state.draft.checks (reutilizado em novo/edição) */
function checksHtml(dateLabel){
  if(!state.draft.checks.length) return "";
  return `
    <div class="section-title">Continuidade${dateLabel?(" — visita de "+dateLabel):""}</div>
    <div class="card"><p class="hint">Marque o que o produtor seguiu desde a última visita:</p>
      <div id="checksList">${state.draft.checks.map((r,i)=>`
        <div class="check"><input type="checkbox" ${r.seguida?"checked":""} onchange="state.draft.checks[${i}].seguida=this.checked"/>
        <div class="lbl"><span class="badge ${r.tipo==='nutricao'?'ok':r.tipo==='cpd'?'warn':r.tipo==='herb'?'n':'dang'}">${r.tipo}</span>
        ${r.descricao}</div></div>`).join("")}</div>
    </div>`;
}

async function iniciarVisita(talhao, existing=null){
  state.talhao=talhao;
  state._editVid = existing ? existing.vid : null;

  // rascunho da visita em memória (novo = vazio; edição = dados carregados)
  state.draft = existing ? existing.draft
    : { observacoes:[], nutricao:[], cpd:[], herb:[], fotos:[], checks:[] };

  const w=$("#cwrap");
  w.innerHTML=`<div class="center" style="padding:24px"><span class="loader dark"></span> ${existing?"Carregando visita…":"Carregando visita anterior…"}</div>`;

  // Continuidade (item 7)
  let prevHtml="";
  if(existing){
    prevHtml = checksHtml("");            // usa os checks já carregados da própria visita
  } else {
    const prev = await carregarRecomendacoesAnteriores();  // recomendações da última visita
    prevHtml = prev.html;
  }

  let dtLocal;
  if(existing){ dtLocal = existing.inicio; }
  else { const now = new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset()); dtLocal = now.toISOString().slice(0,16); }

  const titulo   = existing ? "Editar visita" : "Nova visita";
  const respVal  = existing ? (existing.resp||"")   : "";
  const motivoVal= existing ? (existing.motivo||"") : "";
  const oNutri   = existing ? (existing.obsNutri||""): "";
  const oCpd     = existing ? (existing.obsCpd||"")  : "";
  const oHerb    = existing ? (existing.obsHerb||"") : "";
  const btnLabel = existing ? "💾 Salvar alterações" : "💾 Salvar visita";

  w.innerHTML = `
    <button class="btn ghost small" onclick="${existing?'viewHistoricoPick()':'selFazenda(state.fazenda)'}">← ${existing?'Histórico':'Talhões'}</button>
    <div class="card">
      <h2>${titulo}</h2>
      <div class="hint">${state.fazenda.display_nome} · ${talhao.nome} (${talhao.area_ha} ha)</div>
      ${existing?'<div class="hint"><span class="badge warn">edição</span> Ao salvar, os blocos desta visita serão atualizados.</div>':''}
    </div>

    <div class="section-title">Dados da visita</div>
    <div class="card">
      <label>Data e hora de início</label><input id="v_inicio" type="datetime-local" value="${dtLocal}"/>
      <label>Responsável por acompanhar</label><input id="v_resp" placeholder="Nome de quem acompanhou" value="${respVal.replace(/"/g,'&quot;')}"/>
      <label>Motivo da visita</label><input id="v_motivo" placeholder="Ex.: acompanhamento de florada" value="${motivoVal.replace(/"/g,'&quot;')}"/>
    </div>

    ${prevHtml}

    <div class="section-title">Observações da visita</div>
    <div class="card" id="obsCard">
      <div class="chips" id="obsChips"></div>
      <div id="obsDetails"></div>
    </div>

    <div class="section-title">Manejo da lavoura</div>
    <div class="card">
      <label>Tipo de adubação</label>
      <div class="chips">
        <button class="chip" data-adub="correcao" onclick="pickAdub(this)">Correção</button>
        <button class="chip" data-adub="manutencao" onclick="pickAdub(this)">Manutenção</button>
      </div>

      <div class="subblock">
        <b>5.1 Nutrição</b>
        <div id="nutriList"></div>
        <select id="nutriSel"><option value="">+ Adicionar fertilizante…</option>
          <option value="custom">✏️ Componha seu NPK / Outros</option>
          ${state.catalogos.fert.map(f=>`<option value="${f.id}">${f.nome}</option>`).join("")}</select>
        <div class="npk-summary" id="npkSummary"></div>
        <label>Observações da nutrição</label><textarea id="obs_nutri" rows="2">${oNutri}</textarea>
      </div>

      <div class="subblock">
        <b>5.2 Controle de Pragas e Doenças</b>
        <div id="cpdList"></div>
        <select id="cpdSel"><option value="">+ Adicionar defensivo…</option>
          ${state.catalogos.cpd.map(c=>`<option value="${c.id}">${c.molecula}</option>`).join("")}</select>
        <label>Observações CPD</label><textarea id="obs_cpd" rows="2">${oCpd}</textarea>
      </div>

      <div class="subblock">
        <b>5.3 Controle de Plantas Daninhas</b>
        <div id="herbList"></div>
        <select id="herbSel"><option value="">+ Adicionar herbicida…</option>
          ${state.catalogos.herb.map(h=>`<option value="${h.id}">${h.molecula}</option>`).join("")}</select>
        <label>Observações herbicidas</label><textarea id="obs_herb" rows="2">${oHerb}</textarea>
      </div>
    </div>

    <div class="section-title">Evidências fotográficas</div>
    <div class="card">
      <p class="hint">📍 As fotos <b>não</b> são enviadas ao Supabase — ficam no seu dispositivo.
      Salvamos apenas <b>data/hora/GPS</b> no banco e você pode <b>exportar as fotos</b> ao final.</p>
      <input id="photoInput" type="file" accept="image/*" capture="environment" multiple style="display:none"/>
      <button class="btn secondary" onclick="$('#photoInput').click()">📷 Adicionar foto(s)</button>

      <div class="photogrid" id="photoGrid"></div>
    </div>

    <div class="spacer"></div>

  `;

  buildObsChips();
  if(existing){
    // adubação selecionada
    const ab=document.querySelector(`[data-adub="${_adub}"]`); if(ab) ab.classList.add("on");
    // observações: marca chips e sincroniza campos a partir do draft
    const cats = state.draft.observacoes.map(o=>o.categoria);
    if(cats.length===1 && cats[0]===OBS_EXCLUSIVA){
      const c=$(`#obsChips .chip[data-obs="${OBS_EXCLUSIVA}"]`); if(c) c.classList.add("on");
    } else {
      cats.forEach(cat=>{ const c=$(`#obsChips .chip[data-obs="${cat}"]`); if(c) c.classList.add("on"); });

  renderNutri(); renderCPD(); renderHerb(); renderPhotos();

    if(v==='custom') addCustomNutri(); else addNutri(+v); e.target.value=""; };
  $("#cpdSel").onchange  =e=>{ if(e.target.value){ addCPD(+e.target.value);  e.target.value=""; } };
  $("#herbSel").onchange =e=>{ if(e.target.value){ addHerb(+e.target.value); e.target.value=""; } };
  $("#photoInput").onchange=onPhotos;
  $("#btnSalvarVisita").onclick=salvarVisita;
}

/* ---------- Observações (item 5.4) ---------- */
function buildObsChips(){
  const wrap=$("#obsChips");
  wrap.innerHTML = OBS_CATEGORIAS.map(c=>`<button class="chip" data-obs="${c}" onclick="toggleObs(this)">${c}</button>`).join("");
}
function toggleObs(btn){
  const cat=btn.dataset.obs;
  const excl = cat===OBS_EXCLUSIVA;
  const on = btn.classList.contains("on");
  if(excl && !on){ // ativar "Nenhum problema": limpa as demais
    $$("#obsChips .chip").forEach(b=>b.classList.remove("on"));
    state.draft.observacoes=[];
    btn.classList.add("on");
  } else {
    if(!excl){ $(`#obsChips .chip[data-obs="${OBS_EXCLUSIVA}"]`).classList.remove("on"); }
    btn.classList.toggle("on");
  }
  syncObsDetails();
}
function syncObsDetails(){
  const active=$$("#obsChips .chip.on").map(b=>b.dataset.obs).filter(c=>c!==OBS_EXCLUSIVA);
  const cont=$("#obsDetails");
  cont.innerHTML = active.map(cat=>{
    const prev=state.draft.observacoes.find(o=>o.categoria===cat)||{};
    return `<div class="subblock"><b>${cat}</b>
      <label>O que foi observado</label>
      <textarea rows="2" data-obs-obs="${cat}">${prev.observado||""}</textarea>
      <label>Ação a ser adotada</label>
      <textarea rows="2" data-obs-acao="${cat}">${prev.acao||""}</textarea></div>`;
  }).join("");
}
function collectObs(){
  const nenhum=$(`#obsChips .chip[data-obs="${OBS_EXCLUSIVA}"]`)?.classList.contains("on");
  if(nenhum) return [{categoria:OBS_EXCLUSIVA, observado:null, acao:null}];
  return $$("#obsDetails [data-obs-obs]").map(t=>{
    const cat=t.dataset.obsObs;
    return {categoria:cat, observado:t.value||null,
            acao:$(`#obsDetails [data-obs-acao="${cat}"]`)?.value||null};
  });
}

/* ---------- Nutrição + cálculo NPK (item 5.1) ---------- */
let _adub=null;
function pickAdub(btn){ _adub=btn.dataset.adub;
  $$('[data-adub]').forEach(b=>b.classList.toggle("on", b===btn)); }
/* Só "Outros" ou "Componha seu NPK" permitem editar os teores manualmente */
function isFertCustom(nome){ return /outros|componha/i.test(nome||""); }
function addNutri(fid){ const f=state.catalogos.fert.find(x=>x.id===fid);
  const custom=isFertCustom(f.nome);
  state.draft.nutricao.push({fert_id: custom?null:f.id, fert_nome:f.nome, dose:0,
    custom, cn:0, cp:0, ck:0, f}); renderNutri(); }
function addCustomNutri(){
  state.draft.nutricao.push({fert_id:null, fert_nome:"Componha seu NPK / Outros", dose:0,
    custom:true, cn:0, cp:0, ck:0, f:{n:0,p2o5:0,k2o:0}}); renderNutri(); }
function renderNutri(){
  const box=$("#nutriList");
  box.innerHTML = state.draft.nutricao.map((n,i)=>{
    const base=`
    <div class="nutri-line">
      <span>${n.fert_nome}</span>
      <input type="number" step="1" min="0" placeholder="kg/ha" value="${n.dose||''}"
        oninput="state.draft.nutricao[${i}].dose=num(this.value);calcNPK()"/>
      <button class="btn small danger" onclick="state.draft.nutricao.splice(${i},1);renderNutri()">✕</button>
    </div>`;
    if(!n.custom) return base;
    // Apenas para "Outros"/"Componha seu NPK": teores editáveis
    const edit=`
    <div class="nutri-line" style="grid-template-columns:1fr 1fr 1fr;gap:8px;margin:2px 0 2px">
      <input type="number" step="0.1" min="0" placeholder="% N" value="${n.cn||''}"
        oninput="state.draft.nutricao[${i}].cn=num(this.value);calcNPK()"/>
      <input type="number" step="0.1" min="0" placeholder="% P₂O₅" value="${n.cp||''}"
        oninput="state.draft.nutricao[${i}].cp=num(this.value);calcNPK()"/>
      <input type="number" step="0.1" min="0" placeholder="% K₂O" value="${n.ck||''}"
        oninput="state.draft.nutricao[${i}].ck=num(this.value);calcNPK()"/>
    </div>
    <div class="hint" style="margin:0 2px 8px">Informe os teores (%) deste fertilizante personalizado.</div>`;
    return base+edit;
  }).join("");
  calcNPK();
}
function calcNPK(){
  let tot={};
  state.draft.nutricao.forEach(n=>{
    const d=num(n.dose);
    if(n.custom){ // teores digitados manualmente (apenas N, P₂O₅, K₂O)
      tot.n=(tot.n||0)+d*(num(n.cn)/100);
      tot.p2o5=(tot.p2o5||0)+d*(num(n.cp)/100);
      tot.k2o=(tot.k2o||0)+d*(num(n.ck)/100);
    } else {
      const f=n.f;
      ["n","p2o5","k2o","ca","mg","s","b","cu","fe","mn","mo","zn"].forEach(k=>{
        tot[k]=(tot[k]||0)+d*(num(f[k])/100);
      });
    }
  });
  state.draft._npk=tot;
  $("#npkSummary").innerHTML = `
    <div class="npk-box"><div class="badge n">N</div><div class="v">${(tot.n||0).toFixed(1)}</div><div class="hint">kg/ha</div></div>
    <div class="npk-box"><div class="badge p">P₂O₅</div><div class="v">${(tot.p2o5||0).toFixed(1)}</div><div class="hint">kg/ha</div></div>
    <div class="npk-box"><div class="badge k">K₂O</div><div class="v">${(tot.k2o||0).toFixed(1)}</div><div class="hint">kg/ha</div></div>`;
}

/* ---------- CPD e Herbicidas (5.2 / 5.3) ---------- */
function addCPD(id){ const c=state.catalogos.cpd.find(x=>x.id===id);
  state.draft.cpd.push({cpd_id:c.id, cpd_nome:c.molecula, dose:0, unidade:"L/ha"}); renderCPD(); }
function renderCPD(){
  $("#cpdList").innerHTML = state.draft.cpd.map((c,i)=>doseLine(c,i,"cpd")).join("");
}
function addHerb(id){ const h=state.catalogos.herb.find(x=>x.id===id);
  state.draft.herb.push({herb_id:h.id, herb_nome:h.molecula, dose:0, unidade:"L/ha"}); renderHerb(); }
function renderHerb(){
  $("#herbList").innerHTML = state.draft.herb.map((h,i)=>doseLine(h,i,"herb")).join("");
}
function doseLine(o,i,kind){
  const nome=kind==="cpd"?o.cpd_nome:o.herb_nome;
  return `<div class="nutri-line" style="grid-template-columns:1fr 80px 74px 34px">
    <span>${nome}</span>
    <input type="number" step="0.01" min="0" placeholder="dose" value="${o.dose||''}"
      oninput="state.draft.${kind}[${i}].dose=num(this.value)"/>
    <select onchange="state.draft.${kind}[${i}].unidade=this.value">
      <option ${o.unidade==='L/ha'?'selected':''}>L/ha</option>
      <option ${o.unidade==='kg/ha'?'selected':''}>kg/ha</option>
    </select>
    <button class="btn small danger" onclick="state.draft.${kind}.splice(${i},1);render${kind==='cpd'?'CPD':'Herb'}()">✕</button>
  </div>`;
}

/* ---------- Evidências fotográficas (item 8) ---------- */
async function getGPS(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude, lon:p.coords.longitude}),
      ()=>res(null), {enableHighAccuracy:true, timeout:6000});
  });
}
async function onPhotos(e){
  const files=[...e.target.files]; e.target.value="";
  for(const file of files){
    const gps=await getGPS();
    const url=URL.createObjectURL(file);
    state.draft.fotos.push({file, url, capturado_em:new Date().toISOString(),
      lat:gps?.lat??null, lon:gps?.lon??null});
  }
  renderPhotos();
}
function renderPhotos(){
  $("#photoGrid").innerHTML = state.draft.fotos.map((p,i)=>{
    const media = p.url
      ? `<img src="${p.url}"/>`
      : `<div style="aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:#eef2f7;color:var(--muted);font-size:.78rem;text-align:center;padding:8px">Evidência registrada<br/>(imagem no dispositivo)</div>`;
    return `
    <div class="photo">${media}
      <div class="meta">📅 ${fmtDate(p.capturado_em)}<br/>
      📍 ${p.lat!=null?Number(p.lat).toFixed(5)+", "+Number(p.lon).toFixed(5):"sem GPS"}</div>
      <button class="btn small danger" style="width:100%;border-radius:0"
        onclick="state.draft.fotos.splice(${i},1);renderPhotos()">Remover</button>
    </div>`;
  }).join("");
}

/* ---------- Continuidade entre visitas (item 7) ---------- */
async function carregarRecomendacoesAnteriores(){
  const { data:prev } = await sb.from("visitas").select("id,inicio_em")
    .eq("fazenda_id",state.fazenda.id).order("inicio_em",{ascending:false}).limit(1);
  if(!prev||!prev.length) return {html:""};
  const vid=prev[0].id;
  const [n,c,h,o] = await Promise.all([
    sb.from("visita_nutricao").select("fert_nome,dose_kg_ha").eq("visita_id",vid),
    sb.from("visita_cpd").select("cpd_nome,dose,unidade").eq("visita_id",vid),
    sb.from("visita_herb").select("herb_nome,dose,unidade").eq("visita_id",vid),
    sb.from("visita_observacoes").select("categoria,acao").eq("visita_id",vid),
  ]);
  const recs=[];
  (n.data||[]).forEach(x=>recs.push({tipo:"nutricao",descricao:`${x.fert_nome} — ${x.dose_kg_ha} kg/ha`}));
  (c.data||[]).forEach(x=>recs.push({tipo:"cpd",descricao:`${x.cpd_nome} — ${x.dose} ${x.unidade}`}));
  (h.data||[]).forEach(x=>recs.push({tipo:"herb",descricao:`${x.herb_nome} — ${x.dose} ${x.unidade}`}));
  (o.data||[]).forEach(x=>{ if(x.acao) recs.push({tipo:"acao",descricao:`${x.categoria}: ${x.acao}`}); });
  if(!recs.length) return {html:""};
  state.draft._origem=vid;
  state.draft.checks=recs.map(r=>({...r,seguida:false}));
  const html=`
    <div class="section-title">Continuidade — visita de ${fmtDay(prev[0].inicio_em)}</div>
    <div class="card"><p class="hint">Marque o que o produtor seguiu desde a última visita:</p>

        <div class="check"><input type="checkbox" onchange="state.draft.checks[${i}].seguida=this.checked"/>
        <div class="lbl"><span class="badge ${r.tipo==='nutricao'?'ok':r.tipo==='cpd'?'warn':r.tipo==='herb'?'n':'dang'}">${r.tipo}</span>
        ${r.descricao}</div></div>`).join("")}</div>
    </div>`;
  return {html};
}

/* ---------- SALVAR (persistência no Supabase) — cria OU edita ---------- */
async function salvarVisita(){
  await guard(async()=>{
    if(!_adub) return toast("Selecione o tipo de adubação (correção/manutenção)","err");
    const inicio=$("#v_inicio").value;
    if(!inicio) return toast("Informe a data/hora de início","err");
    const isEdit = !!state._editVid;
    const restoreLabel = isEdit ? "💾 Salvar alterações" : "💾 Salvar visita";
    const b=$("#btnSalvarVisita"); b.innerHTML='<span class="loader"></span> Salvando…'; b.disabled=true;

    const header = {
      inicio_em:new Date(inicio).toISOString(),
      responsavel:$("#v_resp").value||null, motivo:$("#v_motivo").value||null,
      tipo_adub:_adub, obs_nutricao:$("#obs_nutri").value||null,
      obs_cpd:$("#obs_cpd").value||null, obs_herb:$("#obs_herb").value||null
    };

    let vid;
    if(isEdit){
      // 1) atualiza o cabeçalho da visita existente
      vid = state._editVid;
      const { error:eu } = await sb.from("visitas").update(header).eq("id",vid);
      if(eu){ b.disabled=false; b.textContent=restoreLabel; return toast("Falha ao atualizar a visita: "+eu.message,"err"); }
      // 2) apaga os blocos filhos para reinserir o estado atual
      const del = await Promise.all([
        sb.from("visita_observacoes").delete().eq("visita_id",vid),
        sb.from("visita_nutricao").delete().eq("visita_id",vid),
        sb.from("visita_cpd").delete().eq("visita_id",vid),
        sb.from("visita_herb").delete().eq("visita_id",vid),
        sb.from("visita_recomendacoes_check").delete().eq("visita_id",vid),
        sb.from("evidencias_meta").delete().eq("visita_id",vid),
      ]);
      const derr = del.find(r=>r.error);
      if(derr){ b.disabled=false; b.textContent=restoreLabel;
        return toast("Sem permissão para editar (rode o SQL de edição): "+derr.error.message,"err"); }
    } else {
      // 1) cria o cabeçalho da visita
      const { data:vis, error:e1 } = await sb.from("visitas").insert({
        fazenda_id:state.fazenda.id, talhao_id:state.talhao.id, consultor_id:state.user.id, ...header
      }).select().single();
      if(e1){ b.disabled=false; b.textContent=restoreLabel; return toast(e1.message,"err"); }
      vid=vis.id;
    }

    // 2) blocos filhos (comum a criação e edição)
    const obs=collectObs();
    const jobs=[];
    if(obs.length) jobs.push(sb.from("visita_observacoes").insert(obs.map(o=>({...o,visita_id:vid}))));
    if(state.draft.nutricao.length) jobs.push(sb.from("visita_nutricao").insert(
      state.draft.nutricao.map(n=>{
        const d=num(n.dose);
        const base={visita_id:vid, fert_id:n.fert_id, fert_nome:n.fert_nome, dose_kg_ha:d};
        if(n.custom){ // fert_id nulo ⇒ trigger não recalcula; enviamos os teores digitados
          base.n_kg_ha    = +(d*num(n.cn)/100).toFixed(4);
          base.p2o5_kg_ha = +(d*num(n.cp)/100).toFixed(4);
          base.k2o_kg_ha  = +(d*num(n.ck)/100).toFixed(4);
          base.fert_nome  = `${n.fert_nome} (${num(n.cn)}-${num(n.cp)}-${num(n.ck)})`;
        }
        return base;
      })));
    if(state.draft.cpd.length) jobs.push(sb.from("visita_cpd").insert(
      state.draft.cpd.map(c=>({visita_id:vid, cpd_id:c.cpd_id, cpd_nome:c.cpd_nome, dose:num(c.dose), unidade:c.unidade}))));
    if(state.draft.herb.length) jobs.push(sb.from("visita_herb").insert(
      state.draft.herb.map(h=>({visita_id:vid, herb_id:h.herb_id, herb_nome:h.herb_nome, dose:num(h.dose), unidade:h.unidade}))));
    if(state.draft.checks.length) jobs.push(sb.from("visita_recomendacoes_check").insert(
      state.draft.checks.map(r=>({visita_id:vid, origem_visita_id:state.draft._origem||null,
        tipo:r.tipo, descricao:r.descricao, seguida:r.seguida}))));
    if(state.draft.fotos.length) jobs.push(sb.from("evidencias_meta").insert(
      state.draft.fotos.map(p=>({visita_id:vid, capturado_em:p.capturado_em,
        latitude:p.lat, longitude:p.lon, ref_local: p.file ? p.file.name : (p.ref_local||null)}))));
    const results=await Promise.all(jobs);
    const err=results.find(r=>r.error);
    if(err){ toast((isEdit?"Alterações salvas":"Visita salva")+", mas houve erro em um bloco: "+err.error.message,"err"); }
    else toast(isEdit?"Visita atualizada com sucesso!":"Visita salva com sucesso!","ok");

    // guarda referência p/ oferecer exportação
    state._lastVisitId=vid;
    state._editVid=null;            // encerra o modo de edição
    telaPosSalvar(vid, isEdit);
  });
}

async function carregarVisitaCompleta(vid){
  const [v,obs,nut,cpd,herb,chk,evi] = await Promise.all([
    sb.from("visitas").select("*,fazendas(*),talhoes(*),consultores(nome)").eq("id",vid).single(),
    sb.from("visita_observacoes").select("*").eq("visita_id",vid),
    sb.from("visita_nutricao").select("*").eq("visita_id",vid),
    sb.from("visita_cpd").select("*").eq("visita_id",vid),
    sb.from("visita_herb").select("*").eq("visita_id",vid),
    sb.from("visita_recomendacoes_check").select("*").eq("visita_id",vid),
    sb.from("evidencias_meta").select("*").eq("visita_id",vid),
  ]);
  return {v:v.data, obs:obs.data||[], nut:nut.data||[], cpd:cpd.data||[],
          herb:herb.data||[], chk:chk.data||[], evi:evi.data||[]};
}

/* ---------- EDITAR VISITA: carrega os dados e abre o formulário em modo edição ---------- */
async function editarVisita(vid){
  await guard(async()=>{
    const w=$("#cwrap"); w.innerHTML=`<div class="center" style="padding:24px"><span class="loader dark"></span> Carregando visita…</div>`;
    const D=await carregarVisitaCompleta(vid); const v=D.v;
    if(!v) return toast("Visita não encontrada","err");
    if(v.consultor_id!==state.user.id) return toast("Você só pode editar as suas visitas","err");

    // contexto (fazenda/talhão) e tipo de adubação
    state.fazenda = v.fazendas;
    const talhao  = v.talhoes || {id:v.talhao_id, nome:"—", area_ha:"—"};
    _adub = v.tipo_adub || null;

    // monta o rascunho a partir dos dados salvos
    const draft = { observacoes:[], nutricao:[], cpd:[], herb:[], fotos:[], checks:[] };
    draft.observacoes = D.obs.map(o=>({categoria:o.categoria, observado:o.observado, acao:o.acao}));
    draft.nutricao = D.nut.map(n=>{
      const dose = Number(n.dose_kg_ha)||0;
      const fcat = (n.fert_id!=null) ? state.catalogos.fert.find(x=>x.id===n.fert_id) : null;
      if(fcat){ return {fert_id:fcat.id, fert_nome:fcat.nome, dose, custom:false, cn:0,cp:0,ck:0, f:fcat}; }
      // personalizado (ou fertilizante fora do catálogo): deriva os teores a partir dos kg/ha salvos
      const cn = dose>0 ? +(Number(n.n_kg_ha)/dose*100).toFixed(2) : 0;
      const cp = dose>0 ? +(Number(n.p2o5_kg_ha)/dose*100).toFixed(2) : 0;
      const ck = dose>0 ? +(Number(n.k2o_kg_ha)/dose*100).toFixed(2) : 0;
      return {fert_id:null, fert_nome:"Componha seu NPK / Outros", dose, custom:true, cn,cp,ck, f:{n:0,p2o5:0,k2o:0}};
    });
    draft.cpd  = D.cpd.map(c=>({cpd_id:c.cpd_id, cpd_nome:c.cpd_nome, dose:Number(c.dose)||0, unidade:c.unidade||"L/ha"}));
    draft.herb = D.herb.map(h=>({herb_id:h.herb_id, herb_nome:h.herb_nome, dose:Number(h.dose)||0, unidade:h.unidade||"L/ha"}));
    draft.checks = D.chk.map(c=>({tipo:c.tipo, descricao:c.descricao, seguida:!!c.seguida}));
    draft._origem = (D.chk[0] && D.chk[0].origem_visita_id) || null;
    draft.fotos = D.evi.map(e=>({existing:true, capturado_em:e.capturado_em,
      lat:(e.latitude!=null?Number(e.latitude):null), lon:(e.longitude!=null?Number(e.longitude):null), ref_local:e.ref_local}));

    const existing = {
      vid, draft,
      inicio: toLocalInput(v.inicio_em),
      resp: v.responsavel, motivo: v.motivo,
      obsNutri: v.obs_nutricao||"", obsCpd: v.obs_cpd||"", obsHerb: v.obs_herb||""
    };
    await iniciarVisita(talhao, existing);
  });
}

   AAMM_CONSULTOR_RV_PRODUTOR_FAZENDA

async function exportarPDFVisita(vid){
  const D=await carregarVisitaCompleta(vid); const v=D.v;
  // Fotos disponíveis apenas em memória (não vão ao Supabase): usáveis logo após salvar a visita
  const fotos = (state.draft && state._lastVisitId===vid) ? (state.draft.fotos||[]) : [];
  // modal de seleção de seções
  const modal=document.createElement("div");
  modal.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:120;display:flex;align-items:center;justify-content:center;padding:16px";
  const secs=[["cab","Cabeçalho / dados",true],["obs","Observações",true],["nut","Nutrição + NPK",true],
    ["cpd","CPD",true],["herb","Herbicidas",true],["chk","Adesão do produtor",true],["evi","Evidências (metadados)",true]];
  if(fotos.length) secs.push(["fotos",`Fotos no PDF (${fotos.length})`,true]);
  modal.innerHTML=`<div class="card" style="max-width:420px;width:100%">
    <h2>Exportar PDF</h2><p class="hint">Selecione as seções que deseja incluir:</p>
    ${secs.map(s=>`<label class="check"><input type="checkbox" data-sec="${s[0]}" ${s[2]?"checked":""}/> <span class="lbl">${s[1]}</span></label>`).join("")}
    ${fotos.length?'':'<p class="hint">💡 Para incluir as imagens no PDF, exporte logo após salvar a visita (as fotos ficam apenas no dispositivo).</p>'}
    <div class="spacer"></div>
    <button class="btn" id="pdfGo">Gerar PDF</button>
    <button class="btn secondary" id="pdfCancel" style="margin-top:8px">Cancelar</button>
  </div>`;
  document.body.appendChild(modal);
  $("#pdfCancel",modal).onclick=()=>modal.remove();
  $("#pdfGo",modal).onclick=async()=>{
    const pick=Object.fromEntries($$("[data-sec]",modal).map(c=>[c.dataset.sec,c.checked]));
    modal.remove();
    const go=$("#pdfGo"); await gerarPDF(D,pick,fotos);
  };
}

async function gerarPDF(D,pick,fotos=[]){
  const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:"pt",format:"a4"});
  const v=D.v; const W=doc.internal.pageSize.getWidth(); let y=48;
  // header (azul-escuro) com logos
  doc.setFillColor(27,58,91); doc.rect(0,0,W,74,"F");
  doc.setTextColor(255); doc.setFontSize(15); doc.text("Relatório de Visita Técnica",40,34);
  doc.setFontSize(9); doc.text("Projeto Suporte Técnico · Cafeicultura",40,52);
  await addLogosHeader(doc,W);
  doc.setTextColor(15,39,64); y=98;

  if(pick.cab){
    doc.setFontSize(12); doc.setTextColor(15,39,64);
    doc.text(v.fazendas.display_nome,40,y); y+=16;
    doc.setFontSize(9); doc.setTextColor(84,99,122);
    const linhas=[
      `Talhão: ${v.talhoes?.nome||"—"} (${v.talhoes?.area_ha||"—"} ha)`,
      `Data/hora: ${fmtDate(v.inicio_em)}`,
      `Consultor: ${v.consultores?.nome||"—"}`,
      `Responsável: ${v.responsavel||"—"}   ·   Motivo: ${v.motivo||"—"}`,
      `Tipo de adubação: ${v.tipo_adub||"—"}`,
    ];
    linhas.forEach(l=>{doc.text(l,40,y); y+=13;}); y+=6;
  }
  const t=(head,body)=>{ if(!body.length) return;
    doc.autoTable({startY:y, head:[head], body, theme:"grid",
      headStyles:{fillColor:[231,238,246],textColor:[15,39,64],fontStyle:"bold"},
      styles:{fontSize:8,cellPadding:4,textColor:[15,39,64]},
      alternateRowStyles:{fillColor:[248,250,253]}, margin:{left:40,right:40}});
    y=doc.lastAutoTable.finalY+16; };

  if(pick.obs) t(["Observação","O que foi observado","Ação a adotar"],
    D.obs.map(o=>[o.categoria,o.observado||"—",o.acao||"—"]));
  if(pick.nut){
    const npk=D.nut.reduce((a,n)=>({n:a.n+ +n.n_kg_ha,p:a.p+ +n.p2o5_kg_ha,k:a.k+ +n.k2o_kg_ha}),{n:0,p:0,k:0});
    t(["Fertilizante","Dose (kg/ha)","N","P₂O₅","K₂O"],
      D.nut.map(n=>[n.fert_nome,n.dose_kg_ha,(+n.n_kg_ha).toFixed(1),(+n.p2o5_kg_ha).toFixed(1),(+n.k2o_kg_ha).toFixed(1)])
        .concat([["TOTAL","",npk.n.toFixed(1),npk.p.toFixed(1),npk.k.toFixed(1)]]));
  }
  if(pick.cpd) t(["Defensivo (CPD)","Dose"], D.cpd.map(c=>[c.cpd_nome,`${c.dose} ${c.unidade}`]));
  if(pick.herb) t(["Herbicida","Dose"], D.herb.map(h=>[h.herb_nome,`${h.dose} ${h.unidade}`]));
  if(pick.chk) t(["Tipo","Recomendação anterior","Seguiu?"],
    D.chk.map(c=>[c.tipo,c.descricao,c.seguida?"Sim":"Não"]));
  if(pick.evi) t(["Data/hora da foto","Latitude","Longitude"],
    D.evi.map(e=>[fmtDate(e.capturado_em),e.latitude??"—",e.longitude??"—"]));

  // ---- FOTOS embutidas no PDF (base64 em memória, SEM passar pelo Supabase) ----
  if(pick.fotos && fotos && fotos.length){
    const pageH=doc.internal.pageSize.getHeight();
    const marginX=40, gap=12, colW=(W-marginX*2-gap)/2; // 2 colunas
    if(y > pageH-160){ doc.addPage(); y=48; }
    doc.setFontSize(12); doc.setTextColor(15,39,64);
    doc.text("Evidências fotográficas",marginX,y); y+=14;
    let col=0, rowY=y, rowMaxH=0;
    for(let i=0;i<fotos.length;i++){
      const p=fotos[i];
      let dataUrl = p.dataUrl || null;
      if(!dataUrl && p.file){ dataUrl = await fileToDataURL(p.file); }
      const small = dataUrl ? await shrinkImage(dataUrl, 900, 0.7) : null;
      if(!small) continue;
      const imgW=colW, imgH=colW*(small.h/small.w);
      const cellH=imgH+30;
      if(rowY+cellH > pageH-40){ doc.addPage(); rowY=48; col=0; rowMaxH=0; }
      const x=marginX + col*(colW+gap);
      try{ doc.addImage(small.url,"JPEG",x,rowY,imgW,imgH); }catch(e){}
      doc.setDrawColor(219,227,236); doc.rect(x,rowY,imgW,imgH);
      doc.setFontSize(7.5); doc.setTextColor(84,99,122);
      doc.text(`Data: ${fmtDate(p.capturado_em)}`, x+2, rowY+imgH+11);
      doc.text(`GPS: ${p.lat!=null?(p.lat.toFixed(5)+", "+p.lon.toFixed(5)):"sem GPS"}`, x+2, rowY+imgH+21);
      rowMaxH=Math.max(rowMaxH,cellH);
      col++; if(col>=2){ col=0; rowY+=rowMaxH+10; rowMaxH=0; }
    }
  }

  doc.setFontSize(7); doc.setTextColor(150);
  doc.text("Gerado pelo Projeto Suporte Técnico",40,doc.internal.pageSize.getHeight()-24);
  doc.save(nomeArquivoPDF(v));
  toast("PDF gerado"+((pick.fotos&&fotos&&fotos.length)?` com ${fotos.length} foto(s)`:""),"ok");
}

/* ---------- Exportar fotos (item 9) ---------- */
function exportarFotos(){
  if(!state.draft || !state.draft.fotos.length) return toast("Nenhuma foto nesta visita","err");
  state.draft.fotos.forEach((p,i)=>{
    const a=document.createElement("a"); a.href=p.url;
    const d=new Date(p.capturado_em); const aamm=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0");
    a.download=`${aamm}_${camel(state.profile.nome)}_${camel(state.fazenda.produtor)}_${camel(state.fazenda.fazenda)}_foto${i+1}.jpg`;
    document.body.appendChild(a); a.click(); a.remove();
  });
  toast("Fotos exportadas para download","ok");
}

function adminTab(t){
  $("#navDash").classList.toggle("on",t==="dash");
  $("#navUsers").classList.toggle("on",t==="users");
  if(t==="dash") renderDash(); else renderUsers();
}

/* ---------- filtros ---------- */
function applyFilters(v){
  const f=A.filters;
  return v.filter(x=>{
    if(f.consultor && x.consultor!==f.consultor) return false;
    if(f.fazenda && x.fazenda!==f.fazenda) return false;
    if(f.adub && x.tipo_adub!==f.adub) return false;
    if(f.ini && new Date(x.inicio_em) < new Date(f.ini)) return false;
    if(f.fim && new Date(x.inicio_em) > new Date(f.fim+"T23:59:59")) return false;
    return true;
  });
}

function renderDash(){
  const d=A.data;
  const consultores=[...new Set(d.vis.map(v=>v.consultor))].sort();
  const fazendas=[...new Set(d.faz.map(f=>f.display_nome))].sort();
  $("#adminBody").innerHTML=`
    <div class="section-title">Filtros globais</div>
    <div class="card"><div class="filters">
      <div><label>Consultor</label><select id="fc"><option value="">Todos</option>${consultores.map(c=>`<option>${c}</option>`).join("")}</select></div>
      <div><label>Fazenda</label><select id="ff"><option value="">Todas</option>${fazendas.map(f=>`<option>${f}</option>`).join("")}</select></div>
      <div><label>Início</label><input id="fi" type="date"/></div>
      <div><label>Fim</label><input id="fim" type="date"/></div>
      <div><label>Adubação</label><select id="fa"><option value="">Ambas</option><option value="correcao">Correção</option><option value="manutencao">Manutenção</option></select></div>
    </div>
    <div class="spacer"></div>
    <div class="row"><button class="btn small" onclick="onFilter()">Aplicar filtros</button>
      <button class="btn small secondary" onclick="clearFilter()">Limpar</button>
      <button class="btn small secondary" onclick="exportDashXLSX()">⬇️ XLSX</button>
      <button class="btn small secondary" onclick="exportDashPDF()">⬇️ PDF</button></div>
    </div>
    <div id="dashContent"></div>`;
  ["fc","ff","fi","fim","fa"].forEach(id=>{const el=$("#"+id); if(el) el.onchange=onFilter;});
  drawDash();
}
function onFilter(){
  A.filters={consultor:$("#fc").value,fazenda:$("#ff").value,ini:$("#fi").value,fim:$("#fim").value,adub:$("#fa").value};
  drawDash();
}
function clearFilter(){ A.filters={consultor:"",fazenda:"",ini:"",fim:"",adub:""};
  ["fc","ff","fa"].forEach(i=>$("#"+i).value=""); ["fi","fim"].forEach(i=>$("#"+i).value=""); drawDash(); }

function drawDash(){
  const d=A.data; const vis=applyFilters(d.vis);
  // KPIs período
  const total=vis.length;
  const consultoresAtivos=new Set(vis.map(v=>v.consultor)).size;
  const fazVisit=new Set(vis.map(v=>v.fazenda_id)).size;
  // comparação período anterior (mesma janela deslocada) se datas informadas
  let deltaHtml="";
  if(A.filters.ini && A.filters.fim){
    const ini=new Date(A.filters.ini), fim=new Date(A.filters.fim);
    const span=fim-ini; const pIni=new Date(ini-span), pFim=new Date(ini-1);
    const prev=d.vis.filter(v=>{const t=new Date(v.inicio_em); return t>=pIni&&t<=pFim
      && (!A.filters.consultor||v.consultor===A.filters.consultor)
      && (!A.filters.fazenda||v.fazenda===A.filters.fazenda)
      && (!A.filters.adub||v.tipo_adub===A.filters.adub);}).length;
    const diff=total-prev; const sign=diff>=0?"▲":"▼"; const col=diff>=0?"var(--ok)":"var(--danger)";
    deltaHtml=`<div class="d" style="color:${col}">${sign} ${Math.abs(diff)} vs. período anterior (${prev})</div>`;
  }
  // Fazendas não visitadas (no período): total de fazendas - visitadas
  const totalFaz=d.faz.length;
  const naoVisit=totalFaz-fazVisit;
  const pctNao=totalFaz?((naoVisit/totalFaz)*100).toFixed(0):0;

  // NPK filtrado
  const npk=d.npk.filter(x=>(!A.filters.fazenda||x.fazenda===A.filters.fazenda)
    && (!A.filters.adub||x.tipo_adub===A.filters.adub)
    && (!A.filters.ini||x.ano_mes>=A.filters.ini.slice(0,7))
    && (!A.filters.fim||x.ano_mes<=A.filters.fim.slice(0,7)));

  $("#dashContent").innerHTML=`
    <div class="section-title">Visão geral</div>
    <div class="kpis">
      <div class="kpi"><div class="v">${total}</div><div class="l">Visitas no período</div>${deltaHtml}</div>
      <div class="kpi"><div class="v">${naoVisit}</div><div class="l">Fazendas não visitadas</div><div class="d">${pctNao}% do total (${totalFaz})</div></div>
      <div class="kpi"><div class="v">${consultoresAtivos}</div><div class="l">Consultores ativos</div></div>
      <div class="kpi"><div class="v">${fazVisit}</div><div class="l">Fazendas visitadas</div></div>
      <div class="kpi"><div class="v">${d.kpi.evidencias_total||0}</div><div class="l">Evidências (total)</div></div>
      <div class="kpi"><div class="v">${d.kpi.media_visitas_por_consultor||0}</div><div class="l">Média visitas/consultor</div></div>
    </div>

    <div class="section-title">11.1 · Visitas ao longo do tempo</div>
    <div class="card"><div class="chartbox"><canvas id="chTempo"></canvas></div></div>

    <div class="section-title">11.1 · Ranking de visitas por consultor</div>
    <div class="card"><div class="chartbox"><canvas id="chRank"></canvas></div></div>

    <div class="section-title">11.1 · Visitas por consultor e fazenda</div>
    <div class="card tablewrap"><table><thead><tr><th>Consultor</th><th>Fazenda</th><th>Visitas</th></tr></thead>
      <tbody>${tableCF(vis)}</tbody></table></div>

    <div class="section-title">11.2 · Fazendas NÃO visitadas (alerta > ${ALERTA_DIAS} dias)</div>
    <div class="card tablewrap"><table><thead><tr><th>Fazenda</th><th>Consultor</th><th>Última visita</th><th>Dias</th></tr></thead>
      <tbody>${tableNaoVisit(d.st)}</tbody></table></div>

    <div class="section-title">11.3 · Principais recomendações</div>
    <div class="grid2">
      <div class="card"><b>Observações mais frequentes</b><div class="chartbox"><canvas id="chObs"></canvas></div></div>
      <div class="card"><b>Taxa de adesão do produtor</b><div class="chartbox"><canvas id="chAde"></canvas></div></div>
    </div>
    <div class="grid2">
      <div class="card tablewrap"><b>Top fertilizantes</b>${miniTable(d.tf,["item","recomendacoes"],["Item","Rec."])}</div>
      <div class="card tablewrap"><b>Top CPD / Herbicidas</b>${miniTable(d.tc.concat(d.th),["item","recomendacoes"],["Item","Rec."])}</div>
    </div>

    <div class="section-title">11.4 · NPK por fazenda (kg/ha)</div>
    <div class="card"><div class="chartbox"><canvas id="chNPK"></canvas></div></div>
    <div class="card tablewrap"><table><thead><tr><th>Fazenda</th><th>Adub.</th><th>N</th><th>P₂O₅</th><th>K₂O</th></tr></thead>
      <tbody>${tableNPK(npk)}</tbody></table></div>
    <p class="hint">Área por talhão disponível ⇒ visão em kg totais pode ser habilitada futuramente. Unidade atual: kg/ha.</p>
    <div class="spacer"></div><div class="spacer"></div>
  `;

  // ---- gráficos ----
  drawCharts(vis,d,npk);
}

function tableCF(vis){
  const m={}; vis.forEach(v=>{const k=v.consultor+"||"+v.fazenda; m[k]=(m[k]||0)+1;});
  const rows=Object.entries(m).map(([k,n])=>{const[c,f]=k.split("||");return[c,f,n];})
    .sort((a,b)=>b[2]-a[2]);
  return rows.length?rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")
    :`<tr><td colspan="3" class="hint">Sem visitas no filtro.</td></tr>`;
}
function tableNaoVisit(st){
  const rows=st.filter(s=>s.ultima_visita===null || s.dias_sem_visita>ALERTA_DIAS)
    .sort((a,b)=>(b.dias_sem_visita||9999)-(a.dias_sem_visita||9999));
  return rows.length?rows.map(s=>{
    const alert=s.ultima_visita===null||s.dias_sem_visita>ALERTA_DIAS;
    return `<tr style="${alert?'background:#fff6f4':''}">
      <td>${s.fazenda}</td><td>${s.consultor_responsavel||"—"}</td>
      <td>${s.ultima_visita?fmtDay(s.ultima_visita):'<span class="badge dang">nunca</span>'}</td>
      <td>${s.dias_sem_visita!=null?`<span class="badge ${s.dias_sem_visita>ALERTA_DIAS?'dang':'ok'}">${s.dias_sem_visita}</span>`:"—"}</td></tr>`;
  }).join(""):`<tr><td colspan="4" class="hint">Todas as fazendas visitadas dentro do prazo. 🎉</td></tr>`;
}
function tableNPK(npk){
  const m={}; npk.forEach(x=>{const k=x.fazenda+"||"+x.tipo_adub;
    if(!m[k])m[k]={f:x.fazenda,a:x.tipo_adub,n:0,p:0,k:0};
    m[k].n+= +x.n_kg_ha; m[k].p+= +x.p2o5_kg_ha; m[k].k+= +x.k2o_kg_ha;});
  const rows=Object.values(m);
  return rows.length?rows.map(r=>`<tr><td>${r.f}</td><td>${r.a||"—"}</td>
    <td>${r.n.toFixed(1)}</td><td>${r.p.toFixed(1)}</td><td>${r.k.toFixed(1)}</td></tr>`).join("")
    :`<tr><td colspan="5" class="hint">Sem dados de nutrição no filtro.</td></tr>`;
}
function miniTable(rows,keys,heads){
  if(!rows.length) return `<p class="hint">—</p>`;
  return `<table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
    rows.slice(0,10).map(r=>`<tr>${keys.map(k=>`<td>${r[k]}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

function drawCharts(vis,d,npk){
  Object.values(A.charts).forEach(c=>{try{c.destroy()}catch(e){}}); A.charts={};
  const green="#1b3a5b", soft="#9db4cd";
  // tempo (por mês)
  const byMonth={}; vis.forEach(v=>{byMonth[v.ano_mes]=(byMonth[v.ano_mes]||0)+1;});
  const meses=Object.keys(byMonth).sort();
  A.charts.tempo=new Chart($("#chTempo"),{type:"line",
    data:{labels:meses,datasets:[{label:"Visitas",data:meses.map(m=>byMonth[m]),
      borderColor:green,backgroundColor:"rgba(27,58,91,.12)",fill:true,tension:.3}]},
    options:chartOpts()});
  // ranking consultor
  const byC={}; vis.forEach(v=>{byC[v.consultor]=(byC[v.consultor]||0)+1;});
  const cs=Object.entries(byC).sort((a,b)=>b[1]-a[1]);
  A.charts.rank=new Chart($("#chRank"),{type:"bar",
    data:{labels:cs.map(c=>c[0]),datasets:[{label:"Visitas",data:cs.map(c=>c[1]),backgroundColor:green}]},
    options:chartOpts(true)});
  // obs
  A.charts.obs=new Chart($("#chObs"),{type:"bar",
    data:{labels:d.obs.map(o=>o.categoria),datasets:[{data:d.obs.map(o=>o.ocorrencias),backgroundColor:soft}]},
    options:{...chartOpts(true),plugins:{legend:{display:false}}}});
  // adesão
  const seg=d.ade.reduce((a,x)=>a+ +x.seguidas,0), tot=d.ade.reduce((a,x)=>a+ +x.total,0);
  A.charts.ade=new Chart($("#chAde"),{type:"doughnut",
    data:{labels:["Seguidas","Não seguidas"],datasets:[{data:[seg,Math.max(tot-seg,0)],
      backgroundColor:[green,"#e2b4ab"]}]},options:{responsive:true,maintainAspectRatio:false}});
  // NPK por fazenda
  const byF={}; npk.forEach(x=>{if(!byF[x.fazenda])byF[x.fazenda]={n:0,p:0,k:0};
    byF[x.fazenda].n+= +x.n_kg_ha; byF[x.fazenda].p+= +x.p2o5_kg_ha; byF[x.fazenda].k+= +x.k2o_kg_ha;});
  const fl=Object.keys(byF).slice(0,12);
  A.charts.npk=new Chart($("#chNPK"),{type:"bar",
    data:{labels:fl,datasets:[
      {label:"N",data:fl.map(f=>byF[f].n),backgroundColor:"#2d6cdf"},
      {label:"P₂O₅",data:fl.map(f=>byF[f].p),backgroundColor:"#8e44ad"},
      {label:"K₂O",data:fl.map(f=>byF[f].k),backgroundColor:"#e08e0b"}]},
    options:chartOpts()});
}
function chartOpts(horizontalHint){
  return {responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:"#12261f"}}},
    scales:{x:{ticks:{color:"#5b6b64",maxRotation:60,minRotation:0}},
            y:{ticks:{color:"#5b6b64"},beginAtZero:true}}};
}

/* =====================================================================
   ADMIN · gestão de consultores (aprovar/bloquear/remover)
   ===================================================================== */
async function renderUsers(){
  $("#adminBody").innerHTML=`<div class="center" style="padding:24px"><span class="loader dark"></span></div>`;
  const { data } = await sb.from("consultores").select("*").order("status").order("nome");
  const badge=s=>s==="aprovado"?'<span class="badge ok">aprovado</span>'
    :s==="pendente"?'<span class="badge warn">pendente</span>':'<span class="badge dang">bloqueado</span>';
  $("#adminBody").innerHTML=`
    <div class="section-title">Consultores (${data.length})</div>
    <div class="list">${data.map(u=>`
      <div class="item"><div class="grow"><div class="title">${u.nome} ${u.role==='admin'?'<span class="badge n">admin</span>':''}</div>
        <div class="sub">${u.email} · ${badge(u.status)}</div></div>
        ${u.role==='admin'?'':`
        ${u.status!=='aprovado'?`<button class="btn small" onclick="setUser('${u.id}','aprovado')">Aprovar</button>`:''}
        ${u.status!=='bloqueado'?`<button class="btn small secondary" onclick="setUser('${u.id}','bloqueado')">Bloquear</button>`:''}
        <button class="btn small danger" onclick="delUser('${u.id}')">Remover</button>`}
      </div>`).join("")}</div>`;
}
async function setUser(id,status){
  const { error } = await sb.from("consultores").update({status}).eq("id",id);
  if(error) return toast(error.message,"err"); toast("Status atualizado","ok"); renderUsers();
}
async function delUser(id){
  if(!confirm("Remover o perfil deste consultor? (o login no Auth deve ser removido separadamente)")) return;
  const { error } = await sb.from("consultores").delete().eq("id",id);
  if(error) return toast(error.message,"err"); toast("Consultor removido","ok"); renderUsers();
}

/* =====================================================================
   EXPORTAÇÕES DO DASHBOARD (XLSX p/ Power Query + PDF)
   ===================================================================== */
function exportDashXLSX(){
  const d=A.data; const vis=applyFilters(d.vis);
  const wb=XLSX.utils.book_new();
  const cf={}; vis.forEach(v=>{const k=v.consultor+"||"+v.fazenda; cf[k]=(cf[k]||0)+1;});
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    Object.entries(cf).map(([k,n])=>{const[c,f]=k.split("||");return{Consultor:c,Fazenda:f,Visitas:n};})),"Visitas");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    d.st.map(s=>({Fazenda:s.fazenda,Consultor:s.consultor_responsavel,
      Ultima_visita:s.ultima_visita?fmtDay(s.ultima_visita):"nunca",Dias_sem_visita:s.dias_sem_visita})),
    ),"Fazendas_status");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    d.npk.map(x=>({Fazenda:x.fazenda,Adubacao:x.tipo_adub,Ano_mes:x.ano_mes,
      N_kg_ha:x.n_kg_ha,P2O5_kg_ha:x.p2o5_kg_ha,K2O_kg_ha:x.k2o_kg_ha}))),"NPK");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    d.tf.map(x=>({Item:x.item,Recomendacoes:x.recomendacoes,Dose_total_kg_ha:x.dose_total_kg_ha}))),"Top_Fertilizantes");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(d.ade),"Adesao");
  const dt=new Date(); const aamm=String(dt.getFullYear()).slice(2)+String(dt.getMonth()+1).padStart(2,"0");
  XLSX.writeFile(wb,`${aamm}_Dashboard_SuporteTecnico.xlsx`);
  toast("XLSX exportado","ok");
}
async function exportDashPDF(){
  const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:"pt",format:"a4"});
  const d=A.data; const vis=applyFilters(d.vis); const W=doc.internal.pageSize.getWidth();
  doc.setFillColor(27,58,91); doc.rect(0,0,W,74,"F");
  doc.setTextColor(255); doc.setFontSize(15); doc.text("Dashboard Executivo · Projeto Suporte Técnico",40,34);
  doc.setFontSize(9); doc.text("Relatório consolidado de visitas técnicas",40,52);
  await addLogosHeader(doc,W);
  let y=98; doc.setTextColor(15,39,64);
  const kp=[["Visitas (filtro)",vis.length],["Consultores ativos",new Set(vis.map(v=>v.consultor)).size],
    ["Fazendas visitadas",new Set(vis.map(v=>v.fazenda_id)).size],["Fazendas (total)",d.faz.length],
    ["Evidências",d.kpi.evidencias_total||0],["Média visitas/consultor",d.kpi.media_visitas_por_consultor||0]];
  doc.autoTable({startY:y,head:[["Indicador","Valor"]],body:kp,theme:"grid",
    headStyles:{fillColor:[231,238,246],textColor:[15,39,64]},styles:{fontSize:9},margin:{left:40,right:40}});
  y=doc.lastAutoTable.finalY+16;
  const cf={}; vis.forEach(v=>{const k=v.consultor;cf[k]=(cf[k]||0)+1;});
  doc.autoTable({startY:y,head:[["Consultor","Visitas"]],
    body:Object.entries(cf).sort((a,b)=>b[1]-a[1]),theme:"striped",
    headStyles:{fillColor:[231,238,246],textColor:[15,39,64]},styles:{fontSize:9},margin:{left:40,right:40}});
  y=doc.lastAutoTable.finalY+16;
  const alert=d.st.filter(s=>s.ultima_visita===null||s.dias_sem_visita>ALERTA_DIAS)
    .map(s=>[s.fazenda,s.consultor_responsavel||"—",s.ultima_visita?fmtDay(s.ultima_visita):"nunca",s.dias_sem_visita??"—"]);
  doc.autoTable({startY:y,head:[["Fazenda não visitada (>"+ALERTA_DIAS+"d)","Consultor","Última","Dias"]],
    body:alert,theme:"grid",headStyles:{fillColor:[251,228,224],textColor:[192,57,43]},
    styles:{fontSize:8},margin:{left:40,right:40}});
  const dt=new Date(); const aamm=String(dt.getFullYear()).slice(2)+String(dt.getMonth()+1).padStart(2,"0");
  doc.save(`${aamm}_Dashboard_SuporteTecnico.pdf`);
  toast("PDF do dashboard exportado","ok");
}
