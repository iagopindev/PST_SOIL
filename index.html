async function setUser(id,status){
  const { error } = await sb.from("consultores").update({status}).eq("id",id);
  if(error) return toast(error.message,"err"); toast("Status atualizado","ok"); renderUsers();
}
async function delUser(id){
  if(!confirm("Remover o perfil deste consultor? (o login no Auth deve ser removido separadamente)")) return;
  const { error } = await sb.from("consultores").delete().eq("id",id);
  if(error) return toast(error.message,"err"); toast("Consultor removido","ok"); renderUsers();
}

/* =====================================================================
   EXPORTAÇÕES DO DASHBOARD (XLSX p/ Power Query + PDF)
   ===================================================================== */
function exportDashXLSX(){
  const d=A.data; const vis=applyFilters(d.vis);
  const wb=XLSX.utils.book_new();
  const cf={}; vis.forEach(v=>{const k=v.consultor+"||"+v.fazenda; cf[k]=(cf[k]||0)+1;});
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    Object.entries(cf).map(([k,n])=>{const[c,f]=k.split("||");return{Consultor:c,Fazenda:f,Visitas:n};})),"Visitas");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    d.st.map(s=>({Fazenda:s.fazenda,Consultor:s.consultor_responsavel,
      Ultima_visita:s.ultima_visita?fmtDay(s.ultima_visita):"nunca",Dias_sem_visita:s.dias_sem_visita})),
    ),"Fazendas_status");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    d.npk.map(x=>({Fazenda:x.fazenda,Adubacao:adubLabel(x.tipo_adub),Ano_mes:x.ano_mes,
      N_kg_ha:x.n_kg_ha,P2O5_kg_ha:x.p2o5_kg_ha,K2O_kg_ha:x.k2o_kg_ha}))),"NPK_Recomendado");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    (d.npkap||[]).map(x=>({Fazenda:x.fazenda,Ano_mes:x.ano_mes||"",
      N_kg_ha:x.n_kg_ha,P2O5_kg_ha:x.p2o5_kg_ha,K2O_kg_ha:x.k2o_kg_ha}))),"NPK_Aplicado");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    d.tf.map(x=>({Item:x.item,Recomendacoes:x.recomendacoes,Dose_total_kg_ha:x.dose_total_kg_ha}))),"Top_Fertilizantes");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(d.ade),"Adesao");
  const dt=new Date(); const aamm=String(dt.getFullYear()).slice(2)+String(dt.getMonth()+1).padStart(2,"0");
  XLSX.writeFile(wb,`${aamm}_Dashboard_SuporteTecnico.xlsx`);
  toast("XLSX exportado","ok");
}

      <div><label>Adubação</label>
        <select id="ra" multiple size="2"><option value="correcao">Correção</option><option value="manutencao">Manutenção</option></select></div>
      <div><label>Início</label><input id="ri" type="date"/></div>
      <div><label>Fim</label><input id="rfim" type="date"/></div>
      <div><label>Situação</label>
        <select id="red"><option value="">Todas</option><option value="ed">Somente editadas (v&gt;1)</option><option value="or">Somente originais (v1)</option></select></div>
    </div>
    <p class="hint">Segure Ctrl/Cmd (ou toque) para selecionar mais de um item nos campos de múltipla escolha.</p>
    <div class="spacer"></div>
    <div class="row">
      <button class="btn small" onclick="renderReportList()">Aplicar filtros</button>
      <button class="btn small secondary" onclick="clearReportFilters()">Limpar</button>
      <button class="btn small secondary" onclick="batchExport('pdf')">⬇️ PDF ZIP (selecionadas)</button>
      <button class="btn small secondary" onclick="batchExport('xlsx')">⬇️ XLSX (selecionadas)</button>
    </div></div>
    <div id="reportList"></div>`;
  ["rc","rf","ra","ri","rfim","red"].forEach(id=>{const el=$("#"+id); if(el) el.onchange=renderReportList;});
  renderReportList();
}
function clearReportFilters(){
  ["rc","rf","ra"].forEach(id=>{const el=$("#"+id); if(el){ [...el.options].forEach(o=>o.selected=false);} });
  ["ri","rfim"].forEach(id=>{const el=$("#"+id); if(el) el.value="";});
  const red=$("#red"); if(red) red.value="";
  renderReportList();
}
function reportFilteredVisits(){
  const rc=multiVals("rc"), rf=multiVals("rf"), ra=multiVals("ra");
  const ini=$("#ri")?.value||"", fim=$("#rfim")?.value||"", sit=$("#red")?.value||"";
  return (A.data.visRows||[]).filter(v=>{
    const cons=v.consultores?.nome||"", faz=v.fazendas?.display_nome||"", ver=v.versao||1;
    if(rc.length && !rc.includes(cons)) return false;
    if(rf.length && !rf.includes(faz)) return false;
    if(ra.length && !ra.some(a=>String(v.tipo_adub||"").split("+").includes(a))) return false;
    if(ini && new Date(v.inicio_em) < new Date(ini)) return false;
    if(fim && new Date(v.inicio_em) > new Date(fim+"T23:59:59")) return false;
    if(sit==="ed" && !(ver>1)) return false;
    if(sit==="or" && ver>1) return false;
    return true;
  });
}
function renderReportList(){
  const rows=reportFilteredVisits();
  const list=$("#reportList");
  if(!rows.length){ list.innerHTML=`<div class="section-title">Visitas</div>
    <div class="card"><p class="hint">Nenhuma visita corresponde aos filtros.</p></div>`; return; }
  list.innerHTML=`
    <div class="section-title">Visitas encontradas (${rows.length})</div>
    <div class="card tablewrap"><table>
      <thead><tr><th style="width:34px"><input type="checkbox" id="rselAll" onclick="toggleAllReport(this)"/></th>
        <th>Data</th><th>Fazenda</th><th>Consultor</th><th>Adub.</th><th>Versão</th><th>Ações</th></tr></thead>
      <tbody>${rows.map(v=>`
        <tr>
          <td><input type="checkbox" class="rsel" value="${v.id}"/></td>
          <td>${fmtDate(v.inicio_em)}</td>
          <td>${v.fazendas?.display_nome||"—"}<div class="hint">${v.talhoes?.nome||""}</div></td>
          <td>${v.consultores?.nome||"—"}</td>
          <td>${adubLabel(v.tipo_adub)}</td>
          <td>${(v.versao>1)?`<span class="badge warn" title="Editado em ${fmtDate(v.editado_em)}">v${v.versao}</span>`:`<span class="hint">v1</span>`}</td>
          <td style="white-space:nowrap">
            <button class="btn small secondary" onclick="adminVerVisita('${v.id}')">Ver</button>
            <button class="btn small secondary" onclick="editarVisita('${v.id}')">Editar</button>
            <button class="btn small secondary" onclick="exportVisitaPDF('${v.id}')">PDF</button>
            <button class="btn small secondary" onclick="exportVisitaXLSX('${v.id}')">XLSX</button>
            <button class="btn small danger" onclick="adminDeleteVisita('${v.id}')">Excluir</button>
          </td>
        </tr>`).join("")}</tbody>
    </table></div>`;
}
function toggleAllReport(cb){ $$(".rsel").forEach(x=>x.checked=cb.checked); }
function selectedReportVids(){ return $$(".rsel").filter(x=>x.checked).map(x=>x.value); }
async function batchExport(kind){
  const vids=selectedReportVids();
  if(!vids.length) return toast("Selecione ao menos uma visita na lista","err");
  if(kind==="xlsx"){ await exportVisitasXLSXConsolidado(vids); return; }
  await batchExportPDFZip(vids);
}
/* PDF em lote → um ÚNICO arquivo .zip contendo todos os relatórios (nomenclatura mantida).
   Cada PDF preserva o nome padrão AAMM_CONSULTOR_RV_PRODUTOR_FAZENDA.pdf. */
async function batchExportPDFZip(vids){
  if(typeof JSZip==="undefined"){ // fallback: compactador indisponível → baixa individualmente
    toast("Compactador indisponível; baixando PDFs individualmente…","err");
    for(const vid of vids){ await exportVisitaPDF(vid); await new Promise(r=>setTimeout(r,350)); }
    return;
  }
  toast(`Gerando ${vids.length} PDF(s) e compactando em ZIP…`,"ok");
  const zip=new JSZip(); const used={};
  for(const vid of vids){
    try{
      const res=await exportVisitaPDF(vid,{returnBlob:true});
      if(res && res.blob){
        let name=res.filename||`relatorio_${vid}.pdf`;
        // evita colisão de nomes idênticos no mesmo ZIP
        if(used[name]){ used[name]++; name=name.replace(/\.pdf$/i,`_${used[name]}.pdf`); } else used[name]=1;
        zip.file(name, res.blob);
      }
    }catch(e){ console.warn("Falha ao gerar PDF para ZIP:",vid,e); }
  }
  const content=await zip.generateAsync({type:"blob"});
  const dt=new Date(); const aamm=String(dt.getFullYear()).slice(2)+String(dt.getMonth()+1).padStart(2,"0");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(content);
  a.download=`${aamm}_Relatorios_PDF_${vids.length}visitas.zip`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast(`ZIP gerado com ${vids.length} relatório(s) em PDF`,"ok");
}
/* XLSX CONSOLIDADO — um único arquivo com TODAS as visitas selecionadas.
   Abas estruturadas (Power Query/BI), cada linha rastreável pelo relatório. */
async function exportVisitasXLSXConsolidado(vids){
  toast(`Consolidando ${vids.length} relatório(s) em um único Excel…`,"ok");
  const datas = await Promise.all(vids.map(v=>carregarVisitaCompleta(v)));
  const cab=[], obs=[], nut=[], nutAp=[], cpd=[], herb=[], ade=[], evi=[];
  datas.forEach(D=>{
    const v=D.v; const ref=nomeBaseVisita(v);
    const meta={Relatorio:ref, Fazenda:v.fazendas.display_nome,
      Consultor:v.consultores?.nome||"—", DataHora:fmtDate(v.inicio_em)};
    cab.push({...meta,
      Talhao:(v.talhoes?.nome||"—")+" ("+(v.talhoes?.area_ha??"—")+" ha)",
      Responsavel:v.responsavel||"—", Motivo:v.motivo||"—",
      Tipo_adubacao:adubLabel(v.tipo_adub), Versao:"v"+(v.versao||1),
      Editado_em:v.editado_em?fmtDate(v.editado_em):"—",
      Obs_nutricao:v.obs_nutricao||"", Obs_cpd:v.obs_cpd||"", Obs_herb:v.obs_herb||""});
    D.obs.forEach(o=>obs.push({...meta,Categoria:o.categoria,Observado:o.observado||"",Acao:o.acao||""}));
    D.nut.forEach(n=>nut.push({...meta,Tipo_adubacao:adubLabel(n.tipo_adub||v.tipo_adub),
      Fertilizante:n.fert_nome,Dose_kg_ha:n.dose_kg_ha,
      N_kg_ha:+n.n_kg_ha,P2O5_kg_ha:+n.p2o5_kg_ha,K2O_kg_ha:+n.k2o_kg_ha}));
    D.chk.filter(c=>c.tipo==='nutricao'&&c.seguida).forEach(c=>nutAp.push({...meta,
      Fertilizante_aplicado:c.aplicado_nome||"",Dose_kg_ha:c.aplicado_dose??"",
      N_kg_ha:+c.aplicado_n_kg_ha||0,P2O5_kg_ha:+c.aplicado_p2o5_kg_ha||0,K2O_kg_ha:+c.aplicado_k2o_kg_ha||0,
      Substituicao:c.substituicao?"Sim":"Nao"}));
    D.cpd.forEach(c=>cpd.push({...meta,Defensivo:c.cpd_nome,Dose:c.dose,Unidade:c.unidade}));
    D.herb.forEach(h=>herb.push({...meta,Herbicida:h.herb_nome,Dose:h.dose,Unidade:h.unidade}));
    D.chk.forEach(c=>ade.push({...meta,Tipo:c.tipo,Recomendacao:c.descricao,
      Seguiu:c.seguida?"Sim":"Nao",Substituicao:c.substituicao?"Sim":"Nao",
      Adesao_efetiva:(c.seguida&&!c.substituicao)?"Sim":"Nao",
      Aplicado:c.seguida?(c.aplicado_nome||""):"",Dose_aplicada:c.seguida?(c.aplicado_dose??""):"",Unidade:c.seguida?(c.aplicado_unidade||""):""}));
    D.evi.forEach(e=>evi.push({...meta,DataHora_foto:fmtDate(e.capturado_em),
      Latitude:e.latitude,Longitude:e.longitude}));
  });
  const wb=XLSX.utils.book_new();
  const add=(name,rows)=>XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length?rows:[{}]), name);
  add("Cabecalhos",cab); add("Observacoes",obs); add("Nutricao_Recomendada",nut); add("Nutricao_Aplicada",nutAp);
  add("CPD",cpd); add("Herbicidas",herb); add("Adesao",ade); add("Evidencias",evi);
  const dt=new Date(); const aamm=String(dt.getFullYear()).slice(2)+String(dt.getMonth()+1).padStart(2,"0");
  XLSX.writeFile(wb,`${aamm}_Relatorios_Consolidado_${vids.length}visitas.xlsx`);
  toast(`Excel consolidado gerado (${vids.length} visita(s))`,"ok");
}
/* PDF de UMA visita (admin) — todas as seções, sem fotos em memória */
async function exportVisitaPDF(vid, opts={}){
  const D=await carregarVisitaCompleta(vid);
  const fotos=(D.evi||[]).filter(e=>e.storage_path).map(e=>({storage_path:e.storage_path,
    capturado_em:e.capturado_em, lat:(e.latitude!=null?Number(e.latitude):null),
    lon:(e.longitude!=null?Number(e.longitude):null)}));
  const pick={cab:true,obs:true,nut:true,cpd:true,herb:true,chk:true,evi:true,fotos:fotos.length>0};
  return await gerarPDF(D,pick,fotos,opts);
}
/* XLSX de UMA visita (admin) — abas estruturadas p/ Power Query/BI */

    N_kg_ha:+n.n_kg_ha,P2O5_kg_ha:+n.p2o5_kg_ha,K2O_kg_ha:+n.k2o_kg_ha})));
  add("Nutricao_Aplicada", D.chk.filter(c=>c.tipo==='nutricao'&&c.seguida).map(c=>({
    Fertilizante_aplicado:c.aplicado_nome||"",Dose_kg_ha:c.aplicado_dose??"",
    N_kg_ha:+c.aplicado_n_kg_ha||0,P2O5_kg_ha:+c.aplicado_p2o5_kg_ha||0,K2O_kg_ha:+c.aplicado_k2o_kg_ha||0,
    Substituicao:c.substituicao?"Sim":"Nao"})));
  add("CPD", D.cpd.map(c=>({Defensivo:c.cpd_nome,Dose:c.dose,Unidade:c.unidade})));
  add("Herbicidas", D.herb.map(h=>({Herbicida:h.herb_nome,Dose:h.dose,Unidade:h.unidade})));
  add("Adesao", D.chk.map(c=>({Tipo:c.tipo,Recomendacao:c.descricao,
    Seguiu:c.seguida?"Sim":"Nao",Substituicao:c.substituicao?"Sim":"Nao",
    Adesao_efetiva:(c.seguida&&!c.substituicao)?"Sim":"Nao",
    Aplicado:c.seguida?(c.aplicado_nome||""):"",Dose_aplicada:c.seguida?(c.aplicado_dose??""):"",Unidade:c.seguida?(c.aplicado_unidade||""):""})));
  add("Evidencias", D.evi.map(e=>({DataHora:fmtDate(e.capturado_em),Latitude:e.latitude,Longitude:e.longitude})));
  XLSX.writeFile(wb, nomeBaseVisita(v)+".xlsx");
  toast("XLSX da visita exportado","ok");

/* Visualização (somente leitura) de uma visita em modal — para o admin */

  const D=await carregarVisitaCompleta(vid); const v=D.v;
  const npk=D.nut.reduce((a,n)=>({n:a.n+ +n.n_kg_ha,p:a.p+ +n.p2o5_kg_ha,k:a.k+ +n.k2o_kg_ha}),{n:0,p:0,k:0});
  const modal=document.createElement("div");
  modal.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:120;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto";
  modal.innerHTML=`<div class="card" style="max-width:820px;width:100%;margin:20px 0">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div><h2 style="margin-bottom:4px">${v.fazendas.display_nome}</h2>

    ${sec("Nutrição — NPK RECOMENDADO (kg/ha: N "+npk.n.toFixed(1)+" · P₂O₅ "+npk.p.toFixed(1)+" · K₂O "+npk.k.toFixed(1)+")",
       D.nut.map(n=>`<tr><td>${adubLabel(n.tipo_adub)}</td><td>${n.fert_nome}</td><td>${n.dose_kg_ha}</td><td>${(+n.n_kg_ha).toFixed(1)}/${(+n.p2o5_kg_ha).toFixed(1)}/${(+n.k2o_kg_ha).toFixed(1)}</td></tr>`).join(""), ["Adub.","Fertilizante","kg/ha","N/P/K"])}

    ${obsHtml("Observações CPD", v.obs_cpd)}

async function exportDashPDF(){

  doc.setFillColor(27,58,91); doc.rect(0,0,W,74,"F");

  doc.setFontSize(9); doc.text("Relatório consolidado de visitas técnicas",40,52);
  await addLogosHeader(doc,W);
  let y=98; doc.setTextColor(15,39,64);
  const kp=[["Visitas (filtro)",vis.length],["Consultores ativos",new Set(vis.map(v=>v.consultor)).size],
    ["Fazendas visitadas",new Set(vis.map(v=>v.fazenda_id)).size],["Fazendas (total)",d.faz.length],
    ["Evidências",d.kpi.evidencias_total||0],["Média visitas/consultor",d.kpi.media_visitas_por_consultor||0]];

    headStyles:{fillColor:[231,238,246],textColor:[15,39,64]},styles:{fontSize:9},margin:{left:40,right:40}});
  y=doc.lastAutoTable.finalY+16;
  const cf={}; vis.forEach(v=>{const k=v.consultor;cf[k]=(cf[k]||0)+1;});
  doc.autoTable({startY:y,head:[["Consultor","Visitas"]],
    body:Object.entries(cf).sort((a,b)=>b[1]-a[1]),theme:"striped",
    headStyles:{fillColor:[231,238,246],textColor:[15,39,64]},styles:{fontSize:9},margin:{left:40,right:40}});
  y=doc.lastAutoTable.finalY+16;
  const alert=d.st.filter(s=>s.ultima_visita===null||s.dias_sem_visita>ALERTA_DIAS)
    .map(s=>[s.fazenda,s.consultor_responsavel||"—",s.ultima_visita?fmtDay(s.ultima_visita):"nunca",s.dias_sem_visita??"—"]);
  doc.autoTable({startY:y,head:[["Fazenda não visitada (>"+ALERTA_DIAS+"d)","Consultor","Última","Dias"]],
    body:alert,theme:"grid",headStyles:{fillColor:[251,228,224],textColor:[192,57,43]},
    styles:{fontSize:8},margin:{left:40,right:40}});
  const dt=new Date(); const aamm=String(dt.getFullYear()).slice(2)+String(dt.getMonth()+1).padStart(2,"0");
  doc.save(`${aamm}_Dashboard_SuporteTecnico.pdf`);
  toast("PDF do dashboard exportado","ok");
}
