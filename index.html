body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

<script>

const ADMIN_EMAIL       = "adm@br.nestle.com";

/* ---------- util ---------- */
function toast(msg,type=""){const t=$("#toast"); t.className="toast show "+type; t.textContent=msg;
  setTimeout(()=>t.className="toast",2600);}
function fmtDate(d){ if(!d) return "—"; const x=new Date(d);
  return x.toLocaleDateString("pt-BR")+" "+x.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}
function fmtDay(d){ if(!d) return "—"; return new Date(d).toLocaleDateString("pt-BR");}
function norm(s){ return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^A-Za-z0-9]/g,"").replace(/\b\w/g,c=>c.toUpperCase()).replace(/[^A-Za-z0-9]/g,"");}
function camel(s){ // token normalizado p/ nome de arquivo (sem acento/espaço/símbolo)
  return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join("").replace(/[^A-Za-z0-9]/g,"");}
function num(v){ const n=parseFloat(String(v).replace(",",".")); return isFinite(n)?n:0; }
/* Rótulo amigável do(s) tipo(s) de adubação — aceita "correcao", "manutencao" ou "correcao+manutencao" */
function adubLabel(t){ if(!t) return "—";
  return String(t).split("+").map(x=>x==='correcao'?'Correção':x==='manutencao'?'Manutenção':x).join(" + "); }
async function guard(fn){ try{ return await fn(); }catch(e){ console.error(e);
  toast(e.message||"Erro inesperado","err"); throw e; } }
/* Converte File (foto) em dataURL base64 — usado para embutir no PDF SEM subir ao Supabase */
function fileToDataURL(file){
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
}
/* =====================================================================
   ARMAZENAMENTO DE FOTOS NO SUPABASE STORAGE (bucket privado "evidencias")
   - Máximo de 4 fotos por relatório (regra de negócio).
   - Compressão client-side ~1024px / qualidade JPEG 0,6 (leve, cabe mais).
   - O caminho do arquivo é gravado em evidencias_meta.storage_path.
   - Acesso via signed URL (bucket privado; nunca público).
   ===================================================================== */
const STORAGE_BUCKET="evidencias";
const MAX_FOTOS=4;
/* Reamostra a imagem e devolve um Blob JPEG (para upload) */
function shrinkImageToBlob(dataUrl,maxW=1024,quality=0.6){
  return new Promise(res=>{ const img=new Image();
    img.onload=()=>{ const scale=Math.min(1,maxW/img.width);
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>res(b),"image/jpeg",quality); };
    img.onerror=()=>res(null); img.src=dataUrl; });
}
/* Baixa uma URL (signed) e converte para dataURL — para embutir no PDF */
async function fetchAsDataURL(url){
  try{ const r=await fetch(url); const b=await r.blob();
    return await new Promise((res,rej)=>{ const fr=new FileReader();
      fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(b); });
  }catch(e){ console.warn("fetchAsDataURL:",e); return null; }
}
/* Resolve a imagem de uma foto (nova em memória, dataURL, ou path no Storage) */
async function resolveFotoDataURL(p){
  if(p.dataUrl) return p.dataUrl;
  if(p.file)    return await fileToDataURL(p.file);
  if(p.storage_path){
    const { data } = await sb.storage.from(STORAGE_BUCKET).createSignedUrl(p.storage_path,120);
    if(data?.signedUrl) return await fetchAsDataURL(data.signedUrl);
  }
  return null;
}
/* Gera signed URLs (preview) para uma lista de paths do Storage */
async function signedUrls(paths,expira=3600){
  if(!paths.length) return {};
  const { data } = await sb.storage.from(STORAGE_BUCKET).createSignedUrls(paths,expira);
  const map={}; (data||[]).forEach(d=>{ if(d.path && d.signedUrl) map[d.path]=d.signedUrl; });
  return map;
}
/* Sobe as fotos do rascunho ao Storage e devolve metadados (com storage_path).
   - Mantém fotos já existentes (com storage_path e sem novo File).
   - Envia as novas comprimidas em q0.6/~1024px.
   - Remove do bucket os arquivos órfãos (fotos apagadas no formulário). */
async function uploadFotosSupabase(vid){
  const metas=[]; const finalPaths=[];
  const fotos=(state.draft.fotos||[]).slice(0,MAX_FOTOS); // trava dura de 4
  for(let i=0;i<fotos.length;i++){
    const p=fotos[i];
    if(p.storage_path && !p.file){ // foto já existente mantida
      finalPaths.push(p.storage_path);
      metas.push({storage_path:p.storage_path, capturado_em:p.capturado_em, lat:p.lat, lon:p.lon});
      continue;
    }
    let dataUrl=p.dataUrl||null;
    if(!dataUrl && p.file){ dataUrl=await fileToDataURL(p.file); }
    if(!dataUrl) continue;
    const blob=await shrinkImageToBlob(dataUrl,1024,0.6);
    if(!blob) continue;
    const path=`${vid}/${i}_${Date.now()}.jpg`;
    const { error }=await sb.storage.from(STORAGE_BUCKET)
      .upload(path,blob,{contentType:"image/jpeg",upsert:true});
    if(error){ toast("Falha no upload de uma foto: "+error.message,"err"); continue; }
    finalPaths.push(path);
    metas.push({storage_path:path, capturado_em:p.capturado_em, lat:p.lat, lon:p.lon});
  }
  // limpeza de órfãos no bucket (fotos removidas / substituídas)
  try{
    const { data:list }=await sb.storage.from(STORAGE_BUCKET).list(String(vid),{limit:100});
    if(list && list.length){
      const orphans=list.map(o=>`${vid}/${o.name}`).filter(pth=>!finalPaths.includes(pth));
      if(orphans.length) await sb.storage.from(STORAGE_BUCKET).remove(orphans);
    }
  }catch(e){ console.warn("Limpeza de órfãos no Storage:",e); }
  return metas;
}
/* Redimensiona a imagem (largura máx) e devolve dataURL + dimensões, para caber no PDF */
function shrinkImage(dataUrl,maxW=1000,quality=0.72){
  return new Promise(res=>{ const img=new Image();
    img.onload=()=>{ const scale=Math.min(1,maxW/img.width);
      const c=document.createElement("canvas"); c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res({url:c.toDataURL("image/jpeg",quality), w:c.width, h:c.height}); };
    img.onerror=()=>res(null); img.src=dataUrl; });
}
/* Carrega dataURL de um logo e devolve {url,w,h} para o jsPDF */
function loadImageMeta(dataUrl){
  return new Promise(res=>{ if(!dataUrl) return res(null); const img=new Image();
    img.onload=()=>res({url:dataUrl, w:img.width, h:img.height});
    img.onerror=()=>res(null); img.src=dataUrl; });
}

/* =====================================================================
   AUTENTICAÇÃO E ROTEAMENTO POR PERFIL
   ===================================================================== */
async function initAuth(){
  if(!sb){ renderConfigMissing(); return; }
  // 1) Trata o retorno do link de redefinição ANTES de rotear (evita login silencioso).
  //    O Supabase pode devolver o token no hash (#access_token&type=recovery) ou via evento.
  const hash = window.location.hash || "";
  const isRecovery = /type=recovery/.test(hash);
  // Registra o listener primeiro para capturar o evento PASSWORD_RECOVERY.
  sb.auth.onAuthStateChange((event,s)=>{
    if(event==="PASSWORD_RECOVERY"){ renderResetPassword(); return; }
    if(event==="SIGNED_OUT" || !s){ if(!state._resetting) renderLogin(); }
  });
  const { data:{ session } } = await sb.auth.getSession();
  if(isRecovery || state._resetting){ renderResetPassword(); return; }
  if(session){ await loadProfileAndRoute(); }
  else { renderLogin(); }
}
/* Tela para definir a NOVA senha após clicar no link de redefinição */
function renderResetPassword(){

  root.innerHTML = `
  <div class="app">
    <div style="height:34px"></div>
    <div class="center"><div style="font-size:2.2rem">🔑</div>

    <div class="card">

      <div class="spacer"></div>

      <button class="btn ghost small" id="btnCancelReset" style="width:100%;margin-top:8px">Cancelar</button>
    </div>
  </div>`;
  $("#btnSetPass").onclick=doSetNewPassword;
  $("#btnCancelReset").onclick=async()=>{ state._resetting=false;
    try{ await sb.auth.signOut(); }catch(e){}
    cleanRecoveryHash(); renderLogin(); };
  $("#rp_pass2").addEventListener("keydown",e=>{ if(e.key==="Enter") doSetNewPassword(); });
}
/* Remove o hash de recovery da URL para evitar reprocessamento ao recarregar */
function cleanRecoveryHash(){
  if(window.location.hash){
    history.replaceState(null,"",window.location.pathname+window.location.search);
  }
}
async function doSetNewPassword(){
  const p1=$("#rp_pass").value, p2=$("#rp_pass2").value;
  if(p1.length<6) return toast("A senha deve ter ao menos 6 caracteres","err");
  if(p1!==p2)     return toast("As senhas não coincidem","err");
  const b=$("#btnSetPass"); b.innerHTML='<span class="loader"></span> Salvando…'; b.disabled=true;
  const { error } = await sb.auth.updateUser({ password:p1 });
  b.disabled=false; b.textContent="Salvar nova senha";
  if(error) return toast(error.message,"err");
  state._resetting=false; cleanRecoveryHash();
  toast("Senha atualizada com sucesso! Entrando…","ok");
  await loadProfileAndRoute();  // já há sessão válida ⇒ segue direto para o app
}

function renderLogin(){
  state.user=null; state.profile=null;
  root.innerHTML = `
  <div class="app">
    <div style="height:34px"></div>
    <div class="center">
      <div style="font-size:2.2rem">🌱</div>
      <h1 style="color:var(--brand-dark);margin-top:12px">Projeto Suporte Técnico</h1>
      <p class="hint">Cafeicultura (arábica e conilon)</p></div>
    <div class="card">
      <div class="chips" style="margin-bottom:12px">
        <button class="chip on" id="tabLogin">Entrar</button>
        <button class="chip" id="tabSignup">Criar conta</button>
      </div>
      <div id="formLogin">
        <label>E-mail</label><input id="li_email" type="email" autocomplete="email" placeholder="voce@empresa.com.br"/>
        <label>Senha</label><input id="li_pass" type="password" autocomplete="current-password" placeholder="••••••••"/>
        <div class="spacer"></div>
        <button class="btn" id="btnLogin">Entrar</button>
        <div class="spacer"></div>
        <button class="btn ghost small" id="btnReset" style="width:100%">Esqueci minha senha</button>

async function doLogin(){
  const email=$("#li_email").value.trim().toLowerCase(), pass=$("#li_pass").value;
  if(!email||!pass) return toast("Informe e-mail e senha","err");
  const b=$("#btnLogin"); b.innerHTML='<span class="loader"></span> Entrando…'; b.disabled=true;
  const { error } = await sb.auth.signInWithPassword({email, password:pass});
  b.disabled=false; b.textContent="Entrar";
  if(error) return toast(error.message,"err");
  await loadProfileAndRoute();
}
async function doSignup(){
  const nome=$("#su_nome").value.trim(), email=$("#su_email").value.trim().toLowerCase(), pass=$("#su_pass").value;
  if(!nome||!email||pass.length<6) return toast("Preencha nome, e-mail e senha (6+)","err");
  const b=$("#btnSignup"); b.innerHTML='<span class="loader"></span> Criando…'; b.disabled=true;
  const { error } = await sb.auth.signUp({email, password:pass, options:{data:{nome}}});
  b.disabled=false; b.textContent="Criar conta";
  if(error) return toast(error.message,"err");
  toast("Conta criada! Verifique seu e-mail se a confirmação estiver ativa.","ok");
}
async function doReset(){
  const email=$("#li_email").value.trim().toLowerCase();
  if(!email) return toast("Digite seu e-mail no campo acima primeiro","err");
  // valida formato mínimo do e-mail antes de chamar a API
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast("E-mail inválido","err");
  const b=$("#btnReset"); const orig=b?b.textContent:"";
  if(b){ b.disabled=true; b.innerHTML='<span class="loader"></span> Enviando…'; }
  // redirectTo garante que o link volte para ESTE app, disparando o modo de redefinição
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  if(b){ b.disabled=false; b.textContent=orig||"Esqueci minha senha"; }
  // Mensagem neutra (não revela se o e-mail existe — boa prática de segurança)
  toast(error? error.message : "Se o e-mail estiver cadastrado, enviamos um link de redefinição.", error?"err":"ok");
}

async function loadProfileAndRoute(){
  const { data:{ user } } = await sb.auth.getUser(); state.user=user;
  let { data:prof } = await sb.from("consultores").select("*").eq("id",user.id).maybeSingle();
  // fallback: aguarda trigger provisionar
  if(!prof){ await new Promise(r=>setTimeout(r,800));
    ({ data:prof } = await sb.from("consultores").select("*").eq("id",user.id).maybeSingle()); }
  state.profile=prof;
  if(!prof){ return renderPending("Seu perfil está sendo provisionado. Recarregue em instantes."); }
  if(prof.status==="bloqueado") return renderPending("Seu acesso foi bloqueado pelo administrador.");
  if(prof.status==="pendente")  return renderPending("Seu cadastro aguarda aprovação do administrador.");
  await loadCatalogos();
  if(prof.role==="admin") renderAdmin();
  else renderConsultorHome();
}

/* Converte ISO -> valor para input datetime-local (fuso local) */
function toLocalInput(iso){
  const d=new Date(iso); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}
/* Card de continuidade/adesão (container vazio — o conteúdo é montado por renderChecks) */
function checksHtml(dateLabel){
  if(!state.draft.checks.length) return "";
  return `
    <div class="section-title">Continuidade — adesão do produtor${dateLabel?(" · visita de "+dateLabel):""}</div>
    <div class="card"><p class="hint">Marque o que o produtor seguiu. Ao marcar <b>Seguiu</b>, informe o que foi
      <b>efetivamente aplicado</b>. Trocar o produto recomendado é registrado como <b>desvio</b>.</p>
      <div id="checksList"></div>
    </div>`;
}
/* Adesão efetiva = seguiu E sem substituição de produto (substituição = desvio) */
function adesaoEfetiva(r){ return !!r.seguida && !r.substituicao; }
/* Renderiza a lista de recomendações com expansão de "aplicado" quando seguida */
function renderChecks(){
  const box=$("#checksList"); if(!box) return;
  box.innerHTML = state.draft.checks.map((r,i)=>{
    const badge = r.tipo==='nutricao'?'ok':r.tipo==='cpd'?'warn':r.tipo==='herb'?'n':'dang';
    const status = r.seguida
      ? (r.substituicao ? `<span class="badge warn">desvio (substituição)</span>` : `<span class="badge ok">seguiu</span>`)
      : `<span class="badge dang">não seguiu</span>`;
    let panel = "";
    if(r.seguida && r.tipo==='nutricao'){
      const opts = state.catalogos.fert.map(f=>`<option value="${f.id}" ${String(r.ap_id)===String(f.id)?"selected":""}>${f.nome}</option>`).join("");
      const customSel = r.ap_id==='custom';
      panel = `
      <div class="subblock" style="margin-top:8px">
        <label>Fertilizante aplicado</label>
        <select onchange="checkSetFert(${i},this.value)">
          <option value="custom" ${customSel?"selected":""}>✏️ Componha seu NPK / Outros</option>
          ${opts}
        </select>
        <label>Quantidade EXATA aplicada (kg/ha)${r.rec_dose!=null?` <span class="hint" style="font-weight:400">· recomendado: ${r.rec_dose} kg/ha</span>`:""}</label>
        <input type="number" step="0.01" min="0" value="${r.ap_dose??''}" placeholder="digite o valor aplicado (kg/ha)"
          oninput="state.draft.checks[${i}].ap_dose=num(this.value);calcCheckNPK(${i})"/>
        ${customSel?`
        <div class="nutri-line" style="grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px">
          <input type="number" step="0.1" min="0" placeholder="% N"    value="${r.ap_cn||''}" oninput="state.draft.checks[${i}].ap_cn=num(this.value);calcCheckNPK(${i})"/>
          <input type="number" step="0.1" min="0" placeholder="% P₂O₅" value="${r.ap_cp||''}" oninput="state.draft.checks[${i}].ap_cp=num(this.value);calcCheckNPK(${i})"/>
          <input type="number" step="0.1" min="0" placeholder="% K₂O"  value="${r.ap_ck||''}" oninput="state.draft.checks[${i}].ap_ck=num(this.value);calcCheckNPK(${i})"/>
        </div>`:""}
        <div class="npk-summary" id="npkChk_${i}">${npkBoxes(r)}</div>
      </div>`;
    } else if(r.seguida && (r.tipo==='cpd' || r.tipo==='herb')){
      const cat = r.tipo==='cpd' ? state.catalogos.cpd : state.catalogos.herb;
      const opts = cat.map(p=>`<option value="${p.id}" ${String(r.ap_id)===String(p.id)?"selected":""}>${p.molecula}</option>`).join("");
      panel = `
      <div class="subblock" style="margin-top:8px">
        <label>Produto aplicado${r.rec_dose!=null?` <span class="hint" style="font-weight:400">· recomendado: ${r.rec_dose} ${r.rec_unidade||"L/ha"}</span>`:""}</label>
        <select onchange="checkSetProd(${i},this.value)">${opts}</select>
        <div class="nutri-line" style="grid-template-columns:1fr 100px;gap:8px;margin-top:6px">
          <input type="number" step="0.01" min="0" placeholder="dose exata aplicada" value="${r.ap_dose??''}"
            oninput="state.draft.checks[${i}].ap_dose=num(this.value)"/>
          <select onchange="state.draft.checks[${i}].ap_unidade=this.value">
            <option ${r.ap_unidade==='L/ha'?'selected':''}>L/ha</option>
            <option ${r.ap_unidade==='kg/ha'?'selected':''}>kg/ha</option>
          </select>
        </div>
      </div>`;
    }
    return `
    <div class="check" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <input type="checkbox" ${r.seguida?"checked":""} onchange="checkToggle(${i},this.checked)"/>
        <div class="lbl"><span class="badge ${badge}">${r.tipo}</span> ${r.descricao}
          <div style="margin-top:4px">${status}</div></div>
      </div>
      ${panel}
    </div>`;
  }).join("");
}
function npkBoxes(r){
  return `
    <div class="npk-box"><div class="badge n">N</div><div class="v">${(r.ap_n||0).toFixed(1)}</div><div class="hint">kg/ha</div></div>
    <div class="npk-box"><div class="badge p">P₂O₅</div><div class="v">${(r.ap_p||0).toFixed(1)}</div><div class="hint">kg/ha</div></div>
    <div class="npk-box"><div class="badge k">K₂O</div><div class="v">${(r.ap_k||0).toFixed(1)}</div><div class="hint">kg/ha</div></div>`;
}
/* Marca/desmarca "seguiu". Ao marcar, PRÉ-SELECIONA apenas o produto recomendado,
   mas deixa a QUANTIDADE EM BRANCO — o consultor digita o valor EXATO aplicado.
   O valor digitado é usado como está (NPK = dose × teor), nunca somado ao recomendado. */
function checkToggle(i,checked){
  const r=state.draft.checks[i]; r.seguida=checked;
  if(checked && r.ap_id==null){ // primeira marcação: pré-seleciona o produto (dose fica vazia)
    r.ap_id = (r.rec_id!=null? r.rec_id : (r.tipo==='nutricao'?'custom':null));
    r.ap_nome = r.rec_nome||"";
    r.ap_dose = null;              // EM BRANCO: valor exato a ser digitado pelo consultor
    r.ap_unidade = r.rec_unidade||"L/ha";
    r.substituicao = false;
    r.ap_n=r.ap_p=r.ap_k=0;
    if(r.tipo==='nutricao'){ r.ap_fert = state.catalogos.fert.find(x=>String(x.id)===String(r.ap_id))||null; }
  }
  if(!checked){ // limpa o aplicado ao desmarcar
    r.ap_id=null; r.ap_nome=""; r.ap_dose=null; r.ap_unidade=null;
    r.ap_cn=r.ap_cp=r.ap_ck=0; r.ap_n=r.ap_p=r.ap_k=0; r.substituicao=false;
  }
  renderChecks();
}
/* Seleção de fertilizante aplicado (nutrição) — detecta substituição e recalcula NPK */
function checkSetFert(i,val){
  const r=state.draft.checks[i];
  if(val==='custom'){ r.ap_id='custom'; r.ap_nome='Componha seu NPK / Outros';
    r.ap_cn=r.ap_cn||0; r.ap_cp=r.ap_cp||0; r.ap_ck=r.ap_ck||0; r.ap_fert=null; }
  else { const f=state.catalogos.fert.find(x=>String(x.id)===String(val));
    r.ap_id=f?f.id:null; r.ap_nome=f?f.nome:''; r.ap_fert=f||null; }
  r.substituicao = (String(r.ap_id)!==String(r.rec_id)) || (r.ap_id==='custom' && r.rec_id!=null);
  calcCheckNPK(i); renderChecks();
}
/* Seleção de produto aplicado (CPD/Herbicida) — detecta substituição */
function checkSetProd(i,val){
  const r=state.draft.checks[i];
  const cat=r.tipo==='cpd'?state.catalogos.cpd:state.catalogos.herb;
  const p=cat.find(x=>String(x.id)===String(val));
  r.ap_id=p?p.id:null; r.ap_nome=p?p.molecula:'';
  r.substituicao = String(r.ap_id)!==String(r.rec_id);
  renderChecks();
}
/* Calcula o NPK APLICADO de uma recomendação de nutrição */
function calcCheckNPK(i){
  const r=state.draft.checks[i]; const d=num(r.ap_dose);
  if(r.ap_id==='custom'){ r.ap_n=d*num(r.ap_cn)/100; r.ap_p=d*num(r.ap_cp)/100; r.ap_k=d*num(r.ap_ck)/100; }
  else { const f=r.ap_fert || state.catalogos.fert.find(x=>String(x.id)===String(r.ap_id)) || {};
    r.ap_fert=f; r.ap_n=d*num(f.n)/100; r.ap_p=d*num(f.p2o5)/100; r.ap_k=d*num(f.k2o)/100; }
  const el=$("#npkChk_"+i); if(el) el.innerHTML=npkBoxes(r);
}

async function iniciarVisita(talhao, existing=null){
  state.talhao=talhao;
  state._editVid = existing ? existing.vid : null;
  state._editVersao = existing ? (existing.versao||1) : 1;   // versão atual do relatório em edição

  // rascunho da visita em memória (novo = vazio; edição = dados carregados)
  state.draft = existing ? existing.draft
    : { observacoes:[], nutricao:[], cpd:[], herb:[], fotos:[], checks:[], adub:[] };

  const w=$("#cwrap");
  w.innerHTML=`<div class="center" style="padding:24px"><span class="loader dark"></span> ${existing?"Carregando visita…":"Carregando visita anterior…"}</div>`;

  // Continuidade (item 7)
  let prevHtml="";
  if(existing){
    prevHtml = checksHtml("");            // usa os checks já carregados da própria visita
  } else {
    const prev = await carregarRecomendacoesAnteriores();  // recomendações da última visita
    prevHtml = prev.html;
  }

/* ---------- Observações (item 5.4) ---------- */
function buildObsChips(){
  const wrap=$("#obsChips");
  wrap.innerHTML = OBS_CATEGORIAS.map(c=>`<button class="chip" data-obs="${c}" onclick="toggleObs(this)">${c}</button>`).join("");
}
function toggleObs(btn){
  const cat=btn.dataset.obs;
  const excl = cat===OBS_EXCLUSIVA;
  const on = btn.classList.contains("on");
  if(excl && !on){ // ativar "Nenhum problema": limpa as demais
    $$("#obsChips .chip").forEach(b=>b.classList.remove("on"));
    state.draft.observacoes=[];
    btn.classList.add("on");
  } else {
    if(!excl){ $(`#obsChips .chip[data-obs="${OBS_EXCLUSIVA}"]`).classList.remove("on"); }
    btn.classList.toggle("on");
  }
  syncObsDetails();
}
/* Preserva o que já foi digitado nas caixas de observação, gravando no draft
   ANTES de reconstruir o HTML — evita a perda ao (des)marcar outra categoria. */
function captureObsDetails(){
  const cont=$("#obsDetails"); if(!cont) return;
  $$("#obsDetails [data-obs-obs]").forEach(t=>{
    const cat=t.dataset.obsObs;
    const obsVal=t.value||null;
    const acaoVal=$(`#obsDetails [data-obs-acao="${cat}"]`)?.value||null;
    const rec=state.draft.observacoes.find(o=>o.categoria===cat);
    if(rec){ rec.observado=obsVal; rec.acao=acaoVal; }
    else state.draft.observacoes.push({categoria:cat, observado:obsVal, acao:acaoVal});
  });
}
function syncObsDetails(){
  captureObsDetails(); // preserva os textos já digitados antes de re-renderizar
  const active=$$("#obsChips .chip.on").map(b=>b.dataset.obs).filter(c=>c!==OBS_EXCLUSIVA);
  const cont=$("#obsDetails");
  cont.innerHTML = active.map(cat=>{
    const prev=state.draft.observacoes.find(o=>o.categoria===cat)||{};
    return `<div class="subblock"><b>${cat}</b>
      <label>O que foi observado</label>
      <textarea rows="2" data-obs-obs="${cat}">${prev.observado||""}</textarea>
      <label>Ação a ser adotada</label>
      <textarea rows="2" data-obs-acao="${cat}">${prev.acao||""}</textarea></div>`;
  }).join("");
}
function collectObs(){
  const nenhum=$(`#obsChips .chip[data-obs="${OBS_EXCLUSIVA}"]`)?.classList.contains("on");
  if(nenhum) return [{categoria:OBS_EXCLUSIVA, observado:null, acao:null}];
  return $$("#obsDetails [data-obs-obs]").map(t=>{
    const cat=t.dataset.obsObs;
    return {categoria:cat, observado:t.value||null,
            acao:$(`#obsDetails [data-obs-acao="${cat}"]`)?.value||null};
  });
}

/* ---------- Nutrição + cálculo NPK (item 5.1) ---------- */
/* ---------- Adubação (Correção/Manutenção) — múltipla seleção, opcional ----------
   Cada tipo ativo gera um bloco de Nutrição próprio; as linhas de fertilizante
   são marcadas com n.tipo ("correcao"/"manutencao") e persistidas com tipo_adub. */
function toggleAdub(btn){
  const tp=btn.dataset.adub;
  state.draft.adub = state.draft.adub||[];
  const on=btn.classList.toggle("on");
  if(on){ if(!state.draft.adub.includes(tp)) state.draft.adub.push(tp); }
  else { state.draft.adub = state.draft.adub.filter(x=>x!==tp);
    // remove os fertilizantes lançados para o tipo desmarcado
    state.draft.nutricao = state.draft.nutricao.filter(n=>n.tipo!==tp); }
  renderNutri();
}
/* Só "Outros" ou "Componha seu NPK" permitem editar os teores manualmente */
function isFertCustom(nome){ return /outros|componha/i.test(nome||""); }
function addNutri(fid,tp){ const f=state.catalogos.fert.find(x=>x.id===fid);
  const custom=isFertCustom(f.nome);
  state.draft.nutricao.push({tipo:tp, fert_id: custom?null:f.id, fert_nome:f.nome, dose:0,
    custom, cn:0, cp:0, ck:0, f}); renderNutri(); }
function addCustomNutri(tp){
  state.draft.nutricao.push({tipo:tp, fert_id:null, fert_nome:"Componha seu NPK / Outros", dose:0,
    custom:true, cn:0, cp:0, ck:0, f:{n:0,p2o5:0,k2o:0}}); renderNutri(); }
/* Linha de um fertilizante (usa o índice GLOBAL i em state.draft.nutricao) */
function nutriLineHtml(n,i){
  const base=`
    <div class="nutri-line">
      <span>${n.fert_nome}</span>
      <input type="number" step="1" min="0" placeholder="kg/ha" value="${n.dose||''}"
        oninput="state.draft.nutricao[${i}].dose=num(this.value);calcNPK()"/>
      <button class="btn small danger" onclick="state.draft.nutricao.splice(${i},1);renderNutri()">✕</button>
    </div>`;
  if(!n.custom) return base;
  const edit=`
    <div class="nutri-line" style="grid-template-columns:1fr 1fr 1fr;gap:8px;margin:2px 0 2px">
      <input type="number" step="0.1" min="0" placeholder="% N" value="${n.cn||''}"
        oninput="state.draft.nutricao[${i}].cn=num(this.value);calcNPK()"/>
      <input type="number" step="0.1" min="0" placeholder="% P₂O₅" value="${n.cp||''}"
        oninput="state.draft.nutricao[${i}].cp=num(this.value);calcNPK()"/>
      <input type="number" step="0.1" min="0" placeholder="% K₂O" value="${n.ck||''}"
        oninput="state.draft.nutricao[${i}].ck=num(this.value);calcNPK()"/>
    </div>
    <div class="hint" style="margin:0 2px 8px">Informe os teores (%) deste fertilizante personalizado.</div>`;
  return base+edit;
}
/* Renderiza um bloco de Nutrição por tipo de adubação ativo */
function renderNutri(){
  const cont=$("#adubBlocks"); if(!cont) return;
  const types=state.draft.adub||[];
  if(!types.length){
    cont.innerHTML=`<p class="hint">Nenhum tipo de adubação selecionado. Este campo é <b>opcional</b> — você pode salvar a visita sem selecioná-lo.</p>`;
    return;
  }
  cont.innerHTML = types.map(tp=>{
    const label=tp==='correcao'?'Correção':'Manutenção';
    return `<div class="subblock">
      <b>5.1 Nutrição — ${label}</b>
      <div id="nutriList_${tp}"></div>
      <select id="nutriSel_${tp}"><option value="">+ Adicionar fertilizante (${label})…</option>
        <option value="custom">✏️ Componha seu NPK / Outros</option>
        ${state.catalogos.fert.map(f=>`<option value="${f.id}">${f.nome}</option>`).join("")}</select>
      <div class="npk-summary" id="npkSummary_${tp}"></div>
    </div>`;
  }).join("");
  types.forEach(tp=>{
    const box=$("#nutriList_"+tp);
    if(box) box.innerHTML = state.draft.nutricao.map((n,i)=> n.tipo===tp ? nutriLineHtml(n,i) : "").join("");
    const sel=$("#nutriSel_"+tp);
    if(sel) sel.onchange=e=>{ const val=e.target.value; if(!val) return;
      if(val==='custom') addCustomNutri(tp); else addNutri(+val,tp); e.target.value=""; };
  });
  calcNPK();
}
/* NPK calculado por tipo de adubação; atualiza cada resumo #npkSummary_<tipo> */
function calcNPK(){
  const types=state.draft.adub||[];
  const totals={}; types.forEach(tp=>totals[tp]={});
  state.draft.nutricao.forEach(n=>{
    const tp=n.tipo; if(!totals[tp]) totals[tp]={};
    const d=num(n.dose);
    if(n.custom){ // teores digitados manualmente (apenas N, P₂O₅, K₂O)
      totals[tp].n=(totals[tp].n||0)+d*(num(n.cn)/100);
      totals[tp].p2o5=(totals[tp].p2o5||0)+d*(num(n.cp)/100);
      totals[tp].k2o=(totals[tp].k2o||0)+d*(num(n.ck)/100);
    } else {
      const f=n.f||{};
      ["n","p2o5","k2o","ca","mg","s","b","cu","fe","mn","mo","zn"].forEach(k=>{
        totals[tp][k]=(totals[tp][k]||0)+d*(num(f[k])/100);
      });
    }
  });
  state.draft._npk=totals;
  types.forEach(tp=>{
    const tot=totals[tp]||{}; const el=$("#npkSummary_"+tp); if(!el) return;
    el.innerHTML = `
      <div class="npk-box"><div class="badge n">N</div><div class="v">${(tot.n||0).toFixed(1)}</div><div class="hint">kg/ha</div></div>
      <div class="npk-box"><div class="badge p">P₂O₅</div><div class="v">${(tot.p2o5||0).toFixed(1)}</div><div class="hint">kg/ha</div></div>
      <div class="npk-box"><div class="badge k">K₂O</div><div class="v">${(tot.k2o||0).toFixed(1)}</div><div class="hint">kg/ha</div></div>`;
  });
}

/* ---------- CPD e Herbicidas (5.2 / 5.3) ---------- */
function addCPD(id){ const c=state.catalogos.cpd.find(x=>x.id===id);
  state.draft.cpd.push({cpd_id:c.id, cpd_nome:c.molecula, dose:0, unidade:"L/ha"}); renderCPD(); }

}
function addHerb(id){ const h=state.catalogos.herb.find(x=>x.id===id);

function doseLine(o,i,kind){

/* ---------- Evidências fotográficas (item 8) ---------- */
async function getGPS(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude, lon:p.coords.longitude}),
      ()=>res(null), {enableHighAccuracy:true, timeout:6000});
  });
}
async function onPhotos(e){
  const files=[...e.target.files]; e.target.value="";
  for(const file of files){
    if(state.draft.fotos.length>=MAX_FOTOS){
      toast(`Limite de ${MAX_FOTOS} fotos por relatório atingido`,"err"); break;
    }
    const gps=await getGPS();
    const url=URL.createObjectURL(file);
    state.draft.fotos.push({file, url, capturado_em:new Date().toISOString(),
      lat:gps?.lat??null, lon:gps?.lon??null});
  }
  renderPhotos();
}
function renderPhotos(){
  $("#photoGrid").innerHTML = state.draft.fotos.map((p,i)=>{
    const media = p.url
      ? `<img src="${p.url}"/>`
      : `<div style="aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:#eef2f7;color:var(--muted);font-size:.78rem;text-align:center;padding:8px">Evidência registrada<br/>(imagem no dispositivo)</div>`;
    return `
    <div class="photo">${media}
      <div class="meta">📅 ${fmtDate(p.capturado_em)}<br/>
      📍 ${p.lat!=null?Number(p.lat).toFixed(5)+", "+Number(p.lon).toFixed(5):"sem GPS"}</div>
      <button class="btn small danger" style="width:100%;border-radius:0"
        onclick="state.draft.fotos.splice(${i},1);renderPhotos()">Remover</button>
    </div>`;
  }).join("");
  const cnt=$("#fotoCount"); if(cnt) cnt.textContent=`(${state.draft.fotos.length}/${MAX_FOTOS})`;
}

/* ---------- Continuidade entre visitas (item 7) ---------- */
async function carregarRecomendacoesAnteriores(){
  const { data:prev } = await sb.from("visitas").select("id,inicio_em")
    .eq("fazenda_id",state.fazenda.id).order("inicio_em",{ascending:false}).limit(1);
  if(!prev||!prev.length) return {html:""};
  const vid=prev[0].id;
  const [n,c,h,o] = await Promise.all([
    sb.from("visita_nutricao").select("fert_id,fert_nome,dose_kg_ha").eq("visita_id",vid),
    sb.from("visita_cpd").select("cpd_id,cpd_nome,dose,unidade").eq("visita_id",vid),
    sb.from("visita_herb").select("herb_id,herb_nome,dose,unidade").eq("visita_id",vid),
    sb.from("visita_observacoes").select("categoria,acao").eq("visita_id",vid),
  ]);
  const recs=[];
  (n.data||[]).forEach(x=>recs.push({tipo:"nutricao",descricao:`${x.fert_nome} — ${x.dose_kg_ha} kg/ha`,
    rec_id:x.fert_id, rec_nome:x.fert_nome, rec_dose:Number(x.dose_kg_ha)||0}));
  (c.data||[]).forEach(x=>recs.push({tipo:"cpd",descricao:`${x.cpd_nome} — ${x.dose} ${x.unidade}`,
    rec_id:x.cpd_id, rec_nome:x.cpd_nome, rec_dose:Number(x.dose)||0, rec_unidade:x.unidade}));
  (h.data||[]).forEach(x=>recs.push({tipo:"herb",descricao:`${x.herb_nome} — ${x.dose} ${x.unidade}`,
    rec_id:x.herb_id, rec_nome:x.herb_nome, rec_dose:Number(x.dose)||0, rec_unidade:x.unidade}));
  (o.data||[]).forEach(x=>{ if(x.acao) recs.push({tipo:"acao",descricao:`${x.categoria}: ${x.acao}`}); });
  if(!recs.length) return {html:""};
  state.draft._origem=vid;
  state.draft.checks=recs.map(r=>({...r, seguida:false, ap_id:null, ap_nome:"", ap_dose:null,
    ap_unidade:null, ap_cn:0, ap_cp:0, ap_ck:0, ap_n:0, ap_p:0, ap_k:0, ap_fert:null, substituicao:false}));
  const html=`
    <div class="section-title">Continuidade — adesão do produtor · visita de ${fmtDay(prev[0].inicio_em)}</div>
    <div class="card"><p class="hint">Marque o que o produtor seguiu. Ao marcar <b>Seguiu</b>, informe o que foi
      <b>efetivamente aplicado</b>. Trocar o produto recomendado é registrado como <b>desvio</b>.</p>
      <div id="checksList"></div>
    </div>`;
  return {html};
}

/* ---------- SALVAR (persistência no Supabase) — cria OU edita ---------- */
async function salvarVisita(){
  await guard(async()=>{
    // adubação é OPCIONAL: pode ser nenhuma, uma ou as duas
    const adubTipos = state.draft.adub || [];
    const inicio=$("#v_inicio").value;
    if(!inicio) return toast("Informe a data/hora de início","err");
    const isEdit = !!state._editVid;
    const restoreLabel = isEdit ? "💾 Salvar alterações" : "💾 Salvar visita";
    const b=$("#btnSalvarVisita"); b.innerHTML='<span class="loader"></span> Salvando…'; b.disabled=true;

    const header = {
      inicio_em:new Date(inicio).toISOString(),
      responsavel:$("#v_resp").value||null, motivo:$("#v_motivo").value||null,
      tipo_adub: adubTipos.length ? adubTipos.join("+") : null, obs_nutricao:$("#obs_nutri").value||null,
      obs_cpd:$("#obs_cpd").value||null, obs_herb:$("#obs_herb").value||null
    };

    let vid;
    if(isEdit){
      // marca a nova versão do relatório (incrementa e registra o momento da edição)
      header.versao = (state._editVersao||1) + 1;
      header.editado_em = new Date().toISOString();
      // 1) atualiza o cabeçalho da visita existente
      vid = state._editVid;
      const { error:eu } = await sb.from("visitas").update(header).eq("id",vid);
      if(eu){ b.disabled=false; b.textContent=restoreLabel; return toast("Falha ao atualizar a visita: "+eu.message,"err"); }
      // 2) apaga os blocos filhos para reinserir o estado atual
      const del = await Promise.all([
        sb.from("visita_observacoes").delete().eq("visita_id",vid),
        sb.from("visita_nutricao").delete().eq("visita_id",vid),
        sb.from("visita_cpd").delete().eq("visita_id",vid),
        sb.from("visita_herb").delete().eq("visita_id",vid),
        sb.from("visita_recomendacoes_check").delete().eq("visita_id",vid),
        sb.from("evidencias_meta").delete().eq("visita_id",vid),
      ]);
      const derr = del.find(r=>r.error);
      if(derr){ b.disabled=false; b.textContent=restoreLabel;
        return toast("Sem permissão para editar (rode o SQL de edição): "+derr.error.message,"err"); }
    } else {
      // 1) cria o cabeçalho da visita
      const { data:vis, error:e1 } = await sb.from("visitas").insert({
        fazenda_id:state.fazenda.id, talhao_id:state.talhao.id, consultor_id:state.user.id, ...header
      }).select().single();
      if(e1){ b.disabled=false; b.textContent=restoreLabel; return toast(e1.message,"err"); }
      vid=vis.id;
    }

    // 2) blocos filhos (comum a criação e edição)
    const obs=collectObs();
    const jobs=[];
    if(obs.length) jobs.push(sb.from("visita_observacoes").insert(obs.map(o=>({...o,visita_id:vid}))));
    if(state.draft.nutricao.length) jobs.push(sb.from("visita_nutricao").insert(
      state.draft.nutricao.map(n=>{
        const d=num(n.dose);
        const base={visita_id:vid, fert_id:n.fert_id, fert_nome:n.fert_nome, dose_kg_ha:d, tipo_adub:n.tipo||null};
        if(n.custom){ // fert_id nulo ⇒ trigger não recalcula; enviamos os teores digitados
          base.n_kg_ha    = +(d*num(n.cn)/100).toFixed(4);
          base.p2o5_kg_ha = +(d*num(n.cp)/100).toFixed(4);
          base.k2o_kg_ha  = +(d*num(n.ck)/100).toFixed(4);
          base.fert_nome  = `${n.fert_nome} (${num(n.cn)}-${num(n.cp)}-${num(n.ck)})`;
        }
        return base;
      })));
    if(state.draft.cpd.length) jobs.push(sb.from("visita_cpd").insert(
      state.draft.cpd.map(c=>({visita_id:vid, cpd_id:c.cpd_id, cpd_nome:c.cpd_nome, dose:num(c.dose), unidade:c.unidade}))));
    if(state.draft.herb.length) jobs.push(sb.from("visita_herb").insert(
      state.draft.herb.map(h=>({visita_id:vid, herb_id:h.herb_id, herb_nome:h.herb_nome, dose:num(h.dose), unidade:h.unidade}))));
    if(state.draft.checks.length) jobs.push(sb.from("visita_recomendacoes_check").insert(
      state.draft.checks.map(r=>({visita_id:vid, origem_visita_id:state.draft._origem||null,
        tipo:r.tipo, descricao:r.descricao, seguida:r.seguida,
        substituicao: !!r.substituicao,
        adesao_efetiva: adesaoEfetiva(r),
        aplicado_nome: r.seguida ? (r.ap_nome||null) : null,
        aplicado_dose: r.seguida ? (r.ap_dose!=null?num(r.ap_dose):null) : null,
        aplicado_unidade: r.seguida ? (r.ap_unidade||null) : null,
        aplicado_n_kg_ha: (r.seguida && r.tipo==='nutricao') ? +(+r.ap_n||0).toFixed(4) : null,
        aplicado_p2o5_kg_ha: (r.seguida && r.tipo==='nutricao') ? +(+r.ap_p||0).toFixed(4) : null,
        aplicado_k2o_kg_ha: (r.seguida && r.tipo==='nutricao') ? +(+r.ap_k||0).toFixed(4) : null
      }))));
    // Sobe as fotos (≤4, comprimidas q0.6) ao Supabase Storage e obtém os paths
    const fotoMetas = await uploadFotosSupabase(vid);
    if(fotoMetas.length) jobs.push(sb.from("evidencias_meta").insert(
      fotoMetas.map(m=>({visita_id:vid, capturado_em:m.capturado_em,
        latitude:m.lat, longitude:m.lon, storage_path:m.storage_path}))));
    const results=await Promise.all(jobs);
    const err=results.find(r=>r.error);
    if(err){ toast((isEdit?"Alterações salvas":"Visita salva")+", mas houve erro em um bloco: "+err.error.message,"err"); }
    else toast(isEdit?"Visita atualizada com sucesso!":"Visita salva com sucesso!","ok");

    // guarda referência p/ oferecer exportação
    state._lastVisitId=vid;
    state._editVid=null;            // encerra o modo de edição
    telaPosSalvar(vid, isEdit);
  });
}

/* ---------- ADMIN: excluir uma visita por completo (visita + blocos + fotos) ---------- */
async function adminDeleteVisita(vid){
  if(!(state.profile && state.profile.role==='admin')) return toast("Ação restrita ao administrador","err");
  if(!confirm("Excluir DEFINITIVAMENTE esta visita e todos os seus dados (observações, nutrição, CPD, herbicidas, adesão, evidências e fotos)?\n\nEsta ação não pode ser desfeita.")) return;
  await guard(async()=>{
    // 1) remove as fotos do Storage (bucket privado), se houver
    try{
      const { data:list } = await sb.storage.from(STORAGE_BUCKET).list(String(vid),{limit:100});
      if(list && list.length){ await sb.storage.from(STORAGE_BUCKET).remove(list.map(o=>`${vid}/${o.name}`)); }
    }catch(e){ console.warn("Falha ao remover fotos do Storage:",e); }
    // 2) apaga os blocos filhos
    const del = await Promise.all([
      sb.from("visita_observacoes").delete().eq("visita_id",vid),
      sb.from("visita_nutricao").delete().eq("visita_id",vid),
      sb.from("visita_cpd").delete().eq("visita_id",vid),
      sb.from("visita_herb").delete().eq("visita_id",vid),
      sb.from("visita_recomendacoes_check").delete().eq("visita_id",vid),
      sb.from("evidencias_meta").delete().eq("visita_id",vid),
    ]);
    const derr = del.find(r=>r.error);
    if(derr) return toast("Sem permissão para excluir (rode o SQL de admin): "+derr.error.message,"err");
    // 3) apaga a visita (cabeçalho)
    const { error } = await sb.from("visitas").delete().eq("id",vid);
    if(error) return toast(error.message,"err");
    toast("Visita excluída","ok");
    // atualiza as fontes locais e a lista, sem recarregar tudo
    if(A.data){ A.data.visRows=(A.data.visRows||[]).filter(x=>x.id!==vid);
      A.data.vis=(A.data.vis||[]).filter(x=>x.id!==vid); }
    if($("#reportList")) renderReportList();
  });
}

async function carregarVisitaCompleta(vid){
  const [v,obs,nut,cpd,herb,chk,evi] = await Promise.all([
    sb.from("visitas").select("*,fazendas(*),talhoes(*),consultores(nome)").eq("id",vid).single(),
    sb.from("visita_observacoes").select("*").eq("visita_id",vid),
    sb.from("visita_nutricao").select("*").eq("visita_id",vid),
    sb.from("visita_cpd").select("*").eq("visita_id",vid),
    sb.from("visita_herb").select("*").eq("visita_id",vid),
    sb.from("visita_recomendacoes_check").select("*").eq("visita_id",vid),
    sb.from("evidencias_meta").select("*").eq("visita_id",vid),
  ]);
  return {v:v.data, obs:obs.data||[], nut:nut.data||[], cpd:cpd.data||[],
          herb:herb.data||[], chk:chk.data||[], evi:evi.data||[]};
}

/* ---------- EDITAR VISITA: carrega os dados e abre o formulário em modo edição ---------- */
async function editarVisita(vid){
  await guard(async()=>{
    const isAdmin = !!(state.profile && state.profile.role==='admin');
    // No contexto do admin não existe #cwrap; cria uma área de edição dentro do dashboard.
    let w=$("#cwrap");
    if(!w){ const body=$("#adminBody"); if(body){ body.innerHTML=`<div id="cwrap"></div>`; w=$("#cwrap"); } }
    if(!w) return toast("Não foi possível abrir o editor","err");
    w.innerHTML=`<div class="center" style="padding:24px"><span class="loader dark"></span> Carregando visita…</div>`;
    const D=await carregarVisitaCompleta(vid); const v=D.v;
    if(!v) return toast("Visita não encontrada","err");
    if(v.consultor_id!==state.user.id && !isAdmin) return toast("Você só pode editar as suas visitas","err");
    // Marca o modo de edição do admin (controla navegação de retorno e telas pós-salvar).
    state._adminEditing = isAdmin;

    // contexto (fazenda/talhão) e tipo de adubação
    state.fazenda = v.fazendas;
    const talhao  = v.talhoes || {id:v.talhao_id, nome:"—", area_ha:"—"};
    // tipos de adubação da visita (nenhum, um ou os dois)
    let adubSet=[...new Set(D.nut.map(n=>n.tipo_adub).filter(Boolean))];
    if(!adubSet.length && v.tipo_adub){
      adubSet=String(v.tipo_adub).split("+").map(x=>x.trim()).filter(x=>x==='correcao'||x==='manutencao');
    }

    // monta o rascunho a partir dos dados salvos
    const draft = { observacoes:[], nutricao:[], cpd:[], herb:[], fotos:[], checks:[], adub:adubSet };
    draft.observacoes = D.obs.map(o=>({categoria:o.categoria, observado:o.observado, acao:o.acao}));
    draft.nutricao = D.nut.map(n=>{
      const dose = Number(n.dose_kg_ha)||0;
      const tp = n.tipo_adub || adubSet[0] || 'manutencao';
      const fcat = (n.fert_id!=null) ? state.catalogos.fert.find(x=>x.id===n.fert_id) : null;
      if(fcat){ return {tipo:tp, fert_id:fcat.id, fert_nome:fcat.nome, dose, custom:false, cn:0,cp:0,ck:0, f:fcat}; }
      // personalizado (ou fertilizante fora do catálogo): deriva os teores a partir dos kg/ha salvos
      const cn = dose>0 ? +(Number(n.n_kg_ha)/dose*100).toFixed(2) : 0;
      const cp = dose>0 ? +(Number(n.p2o5_kg_ha)/dose*100).toFixed(2) : 0;
      const ck = dose>0 ? +(Number(n.k2o_kg_ha)/dose*100).toFixed(2) : 0;
      return {tipo:tp, fert_id:null, fert_nome:"Componha seu NPK / Outros", dose, custom:true, cn,cp,ck, f:{n:0,p2o5:0,k2o:0}};
    });
    // segurança: se há nutrição mas nenhum tipo detectado, deriva dos próprios registros
    if(!draft.adub.length && draft.nutricao.length){
      draft.adub=[...new Set(draft.nutricao.map(n=>n.tipo))];
    }
    draft.cpd  = D.cpd.map(c=>({cpd_id:c.cpd_id, cpd_nome:c.cpd_nome, dose:Number(c.dose)||0, unidade:c.unidade||"L/ha"}));
    draft.herb = D.herb.map(h=>({herb_id:h.herb_id, herb_nome:h.herb_nome, dose:Number(h.dose)||0, unidade:h.unidade||"L/ha"}));
    draft.checks = D.chk.map(c=>{
      // reidentifica o produto aplicado no catálogo (para dropdown/NPK)
      let ap_id=null, ap_fert=null;
      if(c.aplicado_nome){
        if(c.tipo==='nutricao'){ const f=state.catalogos.fert.find(x=>x.nome===c.aplicado_nome);
          ap_id=f?f.id:'custom'; ap_fert=f||null; }
        else if(c.tipo==='cpd'){ const p=state.catalogos.cpd.find(x=>x.molecula===c.aplicado_nome); ap_id=p?p.id:null; }
        else if(c.tipo==='herb'){ const p=state.catalogos.herb.find(x=>x.molecula===c.aplicado_nome); ap_id=p?p.id:null; }
      }
      return {tipo:c.tipo, descricao:c.descricao, seguida:!!c.seguida,
        substituicao:!!c.substituicao,
        rec_id:null, rec_nome:null, rec_dose:null, rec_unidade:null,
        ap_id, ap_fert, ap_nome:c.aplicado_nome||"",
        ap_dose:(c.aplicado_dose!=null?Number(c.aplicado_dose):null),
        ap_unidade:c.aplicado_unidade||"L/ha",
        ap_cn:0, ap_cp:0, ap_ck:0,
        ap_n:Number(c.aplicado_n_kg_ha)||0, ap_p:Number(c.aplicado_p2o5_kg_ha)||0, ap_k:Number(c.aplicado_k2o_kg_ha)||0};
    });
    draft._origem = (D.chk[0] && D.chk[0].origem_visita_id) || null;
    // Fotos: reconstrói do Supabase Storage. Gera signed URLs para preview e
    // mantém o storage_path para preservar as imagens já existentes ao salvar.
    const evPaths=D.evi.map(e=>e.storage_path).filter(Boolean);
    let urlMap={}; try{ urlMap=await signedUrls(evPaths,3600); }catch(e){}
    draft.fotos = D.evi.map(e=>({
      existing:true, storage_path:e.storage_path||null,
      url:(e.storage_path?urlMap[e.storage_path]:null)||null,
      capturado_em:e.capturado_em,
      lat:(e.latitude!=null?Number(e.latitude):null),
      lon:(e.longitude!=null?Number(e.longitude):null)
    }));

    const existing = {
      vid, draft, versao: v.versao||1,
      inicio: toLocalInput(v.inicio_em),
      resp: v.responsavel, motivo: v.motivo,
      obsNutri: v.obs_nutricao||"", obsCpd: v.obs_cpd||"", obsHerb: v.obs_herb||""
    };
    await iniciarVisita(talhao, existing);
  });
}

function sec(title,rows,cols){
  if(!rows) rows=""; return `<div class="section-title">${title}</div>
    <div class="card tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
    <tbody>${rows||`<tr><td colspan="${cols.length}" class="hint">—</td></tr>`}</tbody></table></div>`;
}
/* Bloco de observação livre (nutrição/CPD/herbicidas) — só renderiza se houver texto */
function obsHtml(label,txt){
  if(txt==null || !String(txt).trim()) return "";
  return `<div class="card" style="padding:10px 14px;margin-top:-6px">
    <div class="hint" style="font-weight:600;text-transform:uppercase;letter-spacing:.4px">${label}</div>
    <div style="white-space:pre-wrap;margin-top:2px">${String(txt).trim()}</div></div>`;
}
/* Soma do NPK APLICADO (informado na adesão do produtor) de uma lista de checks */
function npkAplicadoDeChecks(chk){
  return (chk||[]).filter(c=>c.tipo==='nutricao' && c.seguida)
    .reduce((a,c)=>({n:a.n+ (+c.aplicado_n_kg_ha||0), p:a.p+ (+c.aplicado_p2o5_kg_ha||0), k:a.k+ (+c.aplicado_k2o_kg_ha||0)}),{n:0,p:0,k:0});
}
/* Status legível de uma recomendação (seguiu / desvio / não seguiu) */
function statusAdesao(c){
  if(!c.seguida) return '<span class="badge dang">Não seguiu</span>';
  return c.substituicao ? '<span class="badge warn">Desvio (substituição)</span>' : '<span class="badge ok">Seguiu</span>';
}
/* Descrição do que foi aplicado pelo produtor */
function aplicadoTexto(c){
  if(!c.seguida) return "—";
  if(c.tipo==='nutricao'){
    const npk = `${(+c.aplicado_n_kg_ha||0).toFixed(1)}/${(+c.aplicado_p2o5_kg_ha||0).toFixed(1)}/${(+c.aplicado_k2o_kg_ha||0).toFixed(1)}`;
    return `${c.aplicado_nome||"—"} — ${c.aplicado_dose??"—"} kg/ha (NPK ${npk})`;
  }
  return `${c.aplicado_nome||"—"} — ${c.aplicado_dose??"—"} ${c.aplicado_unidade||""}`;
}
/* Seção de Adesão detalhada (recomendação × aplicado × status) */
function adesaoSection(D){
  if(!D.chk.length) return "";
  const rows=D.chk.map(c=>`<tr><td>${c.tipo}</td><td>${c.descricao}</td><td>${aplicadoTexto(c)}</td><td>${statusAdesao(c)}</td></tr>`).join("");
  return sec("Adesão do produtor (recomendado × aplicado)", rows, ["Tipo","Recomendação","Aplicado pelo produtor","Status"]);
}
/* Seção NPK Aplicado (a partir da adesão) — separado do Recomendado */
function npkAplicadoSection(D){
  const ap=npkAplicadoDeChecks(D.chk);
  if(ap.n===0 && ap.p===0 && ap.k===0) return "";
  return sec("Nutrição — NPK APLICADO pelo produtor (kg/ha: N "+ap.n.toFixed(1)+" · P₂O₅ "+ap.p.toFixed(1)+" · K₂O "+ap.k.toFixed(1)+")",
    D.chk.filter(c=>c.tipo==='nutricao'&&c.seguida).map(c=>`<tr><td>${c.aplicado_nome||"—"}</td><td>${c.aplicado_dose??"—"}</td><td>${(+c.aplicado_n_kg_ha||0).toFixed(1)}/${(+c.aplicado_p2o5_kg_ha||0).toFixed(1)}/${(+c.aplicado_k2o_kg_ha||0).toFixed(1)}</td><td>${c.substituicao?'<span class="badge warn">substituição</span>':'<span class="badge ok">conforme</span>'}</td></tr>`).join(""),
    ["Fertilizante aplicado","kg/ha","N/P/K","Aderência"]);
}

/* =====================================================================
   EXPORTAÇÃO PDF (item 9) — seleção de seções + nomenclatura obrigatória
   AAMM_CONSULTOR_RV_PRODUTOR_FAZENDA
   ===================================================================== */
async function exportarPDFVisita(vid){
  const D=await carregarVisitaCompleta(vid); const v=D.v;
  // Fotos: obtidas do Supabase Storage a partir dos metadados (storage_path).
  // Fallback: rascunho recém-salvo na mesma sessão (ainda em memória).
  let fotos=(D.evi||[]).filter(e=>e.storage_path).map(e=>({storage_path:e.storage_path,
    capturado_em:e.capturado_em, lat:(e.latitude!=null?Number(e.latitude):null),
    lon:(e.longitude!=null?Number(e.longitude):null)}));
  if(!fotos.length && state.draft && state._lastVisitId===vid){ fotos = state.draft.fotos||[]; }
  // modal de seleção de seções
  const modal=document.createElement("div");
  modal.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:120;display:flex;align-items:center;justify-content:center;padding:16px";
  const secs=[["cab","Cabeçalho / dados",true],["obs","Observações",true],["nut","Nutrição + NPK",true],
    ["cpd","CPD",true],["herb","Herbicidas",true],["chk","Adesão do produtor",true]];
  if(fotos.length) secs.push(["fotos",`Fotos no PDF (${fotos.length})`,true]);
  modal.innerHTML=`<div class="card" style="max-width:420px;width:100%">
    <h2>Exportar PDF</h2><p class="hint">Selecione as seções que deseja incluir:</p>
    ${secs.map(s=>`<label class="check"><input type="checkbox" data-sec="${s[0]}" ${s[2]?"checked":""}/> <span class="lbl">${s[1]}</span></label>`).join("")}
    ${fotos.length?'':'<p class="hint">💡 Para incluir as imagens no PDF, exporte logo após salvar a visita (as fotos ficam apenas no dispositivo).</p>'}
    <div class="spacer"></div>
    <button class="btn" id="pdfGo">Gerar PDF</button>
    <button class="btn secondary" id="pdfCancel" style="margin-top:8px">Cancelar</button>
  </div>`;
  document.body.appendChild(modal);
  $("#pdfCancel",modal).onclick=()=>modal.remove();
  $("#pdfGo",modal).onclick=async()=>{
    const pick=Object.fromEntries($$("[data-sec]",modal).map(c=>[c.dataset.sec,c.checked]));
    modal.remove();
    const go=$("#pdfGo"); await gerarPDF(D,pick,fotos);
  };
}

function imgFmt(u){ return /image\/png/i.test(u)?'PNG':(/image\/webp/i.test(u)?'WEBP':'JPEG'); }
/* Sem logo no cabeçalho do PDF (removida a pedido) */
async function addLogosHeader(doc,W){ return; }
function nomeBaseVisita(v){
  const d=new Date(v.inicio_em);
  const aamm=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0");
  return `${aamm}_${camel(v.consultores?.nome||"Consultor")}_RV_${camel(v.fazendas.produtor)}_${camel(v.fazendas.fazenda)}`;
}
function nomeArquivoPDF(v){ return nomeBaseVisita(v)+".pdf"; }

async function gerarPDF(D,pick,fotos=[],opts={}){
  const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:"pt",format:"a4"});
  const v=D.v; const W=doc.internal.pageSize.getWidth(); let y=48;
  // header (azul-escuro) com logos
  doc.setFillColor(27,58,91); doc.rect(0,0,W,74,"F");
  doc.setTextColor(255); doc.setFontSize(15); doc.text("Relatório de Visita Técnica",40,34);
  doc.setFontSize(9); doc.text("Projeto Suporte Técnico · Cafeicultura",40,52);
  // versão (sutil, canto superior direito do cabeçalho)
  doc.setFontSize(8); doc.setTextColor(214,224,236);
  doc.text(`v${v.versao||1}${(v.versao>1)?" · editado":""}`, W-40, 34, {align:"right"});
  await addLogosHeader(doc,W);
  doc.setTextColor(15,39,64); y=98;

  if(pick.cab){
    doc.setFontSize(12); doc.setTextColor(15,39,64);
    doc.text(v.fazendas.display_nome,40,y); y+=16;
    doc.setFontSize(9); doc.setTextColor(84,99,122);
    const linhas=[
      `Talhão: ${v.talhoes?.nome||"—"} (${v.talhoes?.area_ha||"—"} ha)`,
      `Data/hora: ${fmtDate(v.inicio_em)}`,
      `Consultor: ${v.consultores?.nome||"—"}`,
      `Responsável: ${v.responsavel||"—"}   ·   Motivo: ${v.motivo||"—"}`,
      `Tipo de adubação: ${adubLabel(v.tipo_adub)}`,
      `Versão: v${v.versao||1}${(v.versao>1)?" (editado em "+fmtDate(v.editado_em)+")":" (original)"}`,
    ];
    // Quebra automática de linha para textos longos (ex.: Motivo), respeitando a margem
    const maxW = W - 80; // 40pt de margem em cada lado
    linhas.forEach(l=>{
      const wrapped = doc.splitTextToSize(String(l), maxW);
      wrapped.forEach(wl=>{
        if(y > doc.internal.pageSize.getHeight()-40){ doc.addPage(); y=48; }
        doc.text(wl,40,y); y+=13;
      });
    });
    y+=6;
  }
  // Tabela PADRÃO — estilo único para TODAS as seções do relatório
  const t=(head,body)=>{ if(!body.length) return;
    doc.autoTable({startY:y, head:[head], body, theme:"grid",
      headStyles:{fillColor:[231,238,246],textColor:[15,39,64],fontStyle:"bold"},
      styles:{fontSize:8,cellPadding:4,textColor:[15,39,64],lineColor:[219,227,236],lineWidth:0.3},
      alternateRowStyles:{fillColor:[248,250,253]}, margin:{left:40,right:40}});
    y=doc.lastAutoTable.finalY+16; };
  // Faixa/título de seção PADRONIZADA (azul-escuro, texto branco) — usada em todas as seções
  const banner=(txt)=>{ const pageH=doc.internal.pageSize.getHeight();
    if(y > pageH-70){ doc.addPage(); y=48; }
    doc.setFillColor(27,58,91); doc.rect(40,y-9,W-80,22,"F");
    doc.setFontSize(10); doc.setTextColor(255,255,255); doc.setFont(undefined,"bold");
    doc.text(String(txt).toUpperCase(),48,y+5); doc.setFont(undefined,"normal");
    doc.setTextColor(15,39,64); y+=28; };
  // Caixa de nota/selo (fundo claro, faixa lateral azul) — destaque textual da recomendação
  const notebox=(txt)=>{ const pageH=doc.internal.pageSize.getHeight();
    const lines=doc.splitTextToSize(txt, W-80-16);
    const h=12+lines.length*11;
    if(y > pageH-h-20){ doc.addPage(); y=48; }
    doc.setFillColor(240,245,251); doc.rect(40,y-6,W-80,h,"F");
    doc.setFillColor(27,58,91); doc.rect(40,y-6,4,h,"F");
    doc.setFontSize(8.5); doc.setTextColor(27,58,91);
    doc.text(lines,52,y+6); doc.setTextColor(15,39,64); y+=h+8; };
  // Linha de observação livre (rótulo + texto), com quebra automática e paginação
  const obsText=(label,txt)=>{ if(txt==null || !String(txt).trim()) return;
    const pageH=doc.internal.pageSize.getHeight();
    const lines=doc.splitTextToSize(`${label}: ${String(txt).trim()}`, W-80);
    const h=lines.length*11+6;
    if(y > pageH-h-20){ doc.addPage(); y=48; }
    doc.setFontSize(8.5); doc.setTextColor(84,99,122); doc.setFont(undefined,"italic");
    doc.text(lines,40,y+4); doc.setFont(undefined,"normal");
    doc.setTextColor(15,39,64); y+=h+8; };

  // 1) OBSERVAÇÕES DA VISITA
  if(pick.obs){ banner("Observações da visita");
    t(["Observação","O que foi observado","Ação a adotar"],
      (D.obs.length?D.obs:[{}]).map(o=>[o.categoria||"—",o.observado||"—",o.acao||"—"])); }

  // 2) PLANEJADO × EXECUTADO — ADESÃO DO PRODUTOR (vem ANTES da recomendação atual)
  if(pick.chk && D.chk.length){
    banner("Planejado × Executado — Adesão do Produtor");
    t(["Tipo","Recomendação anterior","Aplicado pelo produtor","Status"],
      D.chk.map(c=>[c.tipo,c.descricao,
        c.seguida?((c.aplicado_nome||"—")+" — "+(c.aplicado_dose??"—")+(c.tipo==='nutricao'?" kg/ha":(" "+(c.aplicado_unidade||"")))):"—",
        !c.seguida?"Não seguiu":(c.substituicao?"Desvio (substituição)":"Seguiu")]));
    const ap=npkAplicadoDeChecks(D.chk);
    if(ap.n||ap.p||ap.k){
      t(["Fertilizantes aplicados","Dose (kg/ha)","N","P₂O₅","K₂O"],
        D.chk.filter(c=>c.tipo==='nutricao'&&c.seguida).map(c=>[c.aplicado_nome||"—",c.aplicado_dose??"—",
          (+c.aplicado_n_kg_ha||0).toFixed(1),(+c.aplicado_p2o5_kg_ha||0).toFixed(1),(+c.aplicado_k2o_kg_ha||0).toFixed(1)])
          .concat([["TOTAL","",ap.n.toFixed(1),ap.p.toFixed(1),ap.k.toFixed(1)]]));
    }
  }

  // 3) RECOMENDAÇÃO TÉCNICA — MANEJO DA LAVOURA (da visita atual)
  // Observações livres de cada bloco (nutrição/CPD/herbicidas) também são impressas.
  const hasNut  = pick.nut  && (D.nut.length  || (v.obs_nutricao && String(v.obs_nutricao).trim()));
  const hasCpd  = pick.cpd  && (D.cpd.length  || (v.obs_cpd      && String(v.obs_cpd).trim()));
  const hasHerb = pick.herb && (D.herb.length || (v.obs_herb     && String(v.obs_herb).trim()));
  if(hasNut || hasCpd || hasHerb){
    banner("Recomendação Técnica — Manejo da Lavoura");
    if(pick.nut && D.nut.length){
      notebox("RECOMENDAÇÃO TÉCNICA — Estes dados são as recomendações do manejo da lavoura desta visita e devem ser comparadas, na próxima visita, com o que foi efetivamente aplicado pelo produtor.");
      const groups={};
      D.nut.forEach(n=>{ const k=n.tipo_adub||v.tipo_adub||"—"; (groups[k]=groups[k]||[]).push(n); });
      Object.keys(groups).forEach(k=>{
        const rows=groups[k];
        const npk=rows.reduce((a,n)=>({n:a.n+ +n.n_kg_ha,p:a.p+ +n.p2o5_kg_ha,k:a.k+ +n.k2o_kg_ha}),{n:0,p:0,k:0});
        t([`Fertilizante recomendado — ${adubLabel(k)}`,"Dose (kg/ha)","N","P₂O₅","K₂O"],
          rows.map(n=>[n.fert_nome,n.dose_kg_ha,(+n.n_kg_ha).toFixed(1),(+n.p2o5_kg_ha).toFixed(1),(+n.k2o_kg_ha).toFixed(1)])
            .concat([["TOTAL","",npk.n.toFixed(1),npk.p.toFixed(1),npk.k.toFixed(1)]]));
      });
    }
    if(hasNut)  obsText("Observações da nutrição", v.obs_nutricao);
    if(pick.cpd && D.cpd.length) t(["CPD recomendado","Dose","Unidade"], D.cpd.map(c=>[c.cpd_nome,c.dose,c.unidade]));
    if(hasCpd)  obsText("Observações CPD", v.obs_cpd);
    if(pick.herb && D.herb.length) t(["Herbicida recomendado","Dose","Unidade"], D.herb.map(h=>[h.herb_nome,h.dose,h.unidade]));
    if(hasHerb) obsText("Observações herbicidas", v.obs_herb);
  }
  // Metadados das evidências NÃO entram como tabela — aparecem apenas como legenda das fotos.

  // ---- FOTOS embutidas no PDF (baixadas do Supabase Storage via signed URL) ----
  if(pick.fotos && fotos && fotos.length){
    const pageH=doc.internal.pageSize.getHeight();
    const marginX=40, gap=12, colW=(W-marginX*2-gap)/2; // 2 colunas
    if(y > pageH-160){ doc.addPage(); y=48; }
    banner("Evidências fotográficas");   // mesma faixa-título padrão das demais seções
    let col=0, rowY=y, rowMaxH=0;
    for(let i=0;i<fotos.length;i++){
      const p=fotos[i];
      const dataUrl = await resolveFotoDataURL(p);
      const small = dataUrl ? await shrinkImage(dataUrl, 900, 0.7) : null;
      if(!small) continue;
      const imgW=colW, imgH=colW*(small.h/small.w);
      const cellH=imgH+30;
      if(rowY+cellH > pageH-40){ doc.addPage(); rowY=48; col=0; rowMaxH=0; }
      const x=marginX + col*(colW+gap);
      try{ doc.addImage(small.url,"JPEG",x,rowY,imgW,imgH); }catch(e){}
      doc.setDrawColor(219,227,236); doc.rect(x,rowY,imgW,imgH);
      doc.setFontSize(7.5); doc.setTextColor(84,99,122);
      doc.text(`Data: ${fmtDate(p.capturado_em)}`, x+2, rowY+imgH+11);
      doc.text(`GPS: ${p.lat!=null?(p.lat.toFixed(5)+", "+p.lon.toFixed(5)):"sem GPS"}`, x+2, rowY+imgH+21);
      rowMaxH=Math.max(rowMaxH,cellH);
      col++; if(col>=2){ col=0; rowY+=rowMaxH+10; rowMaxH=0; }
    }
  }

  doc.setFontSize(7); doc.setTextColor(150);
  doc.text("Gerado pelo Projeto Suporte Técnico",40,doc.internal.pageSize.getHeight()-24);
  // Modo compactação: devolve o PDF como blob (não baixa nem exibe toast individual).
  if(opts && opts.returnBlob){ return { blob: doc.output("blob"), filename: nomeArquivoPDF(v) }; }
  doc.save(nomeArquivoPDF(v));
  toast("PDF gerado"+((pick.fotos&&fotos&&fotos.length)?` com ${fotos.length} foto(s)`:""),"ok");
}

}

/* ---------- filtros ---------- */
function applyFilters(v){
  const f=A.filters;
  return v.filter(x=>{
    if(f.consultor && x.consultor!==f.consultor) return false;
    if(f.fazenda && x.fazenda!==f.fazenda) return false;
    if(f.adub && !String(x.tipo_adub||"").split("+").includes(f.adub)) return false;
    if(f.ini && new Date(x.inicio_em) < new Date(f.ini)) return false;
    if(f.fim && new Date(x.inicio_em) > new Date(f.fim+"T23:59:59")) return false;
    return true;
  });
}

function renderDash(){
  const d=A.data;
  const consultores=[...new Set(d.vis.map(v=>v.consultor))].sort();
  const fazendas=[...new Set(d.faz.map(f=>f.display_nome))].sort();
  $("#adminBody").innerHTML=`
    <div class="section-title">Filtros globais</div>
    <div class="card"><div class="filters">
      <div><label>Consultor</label><select id="fc"><option value="">Todos</option>${consultores.map(c=>`<option>${c}</option>`).join("")}</select></div>
      <div><label>Fazenda</label><select id="ff"><option value="">Todas</option>${fazendas.map(f=>`<option>${f}</option>`).join("")}</select></div>
      <div><label>Início</label><input id="fi" type="date"/></div>
      <div><label>Fim</label><input id="fim" type="date"/></div>
      <div><label>Adubação</label><select id="fa"><option value="">Ambas</option><option value="correcao">Correção</option><option value="manutencao">Manutenção</option></select></div>
    </div>
    <div class="spacer"></div>
    <div class="row"><button class="btn small" onclick="onFilter()">Aplicar filtros</button>
      <button class="btn small secondary" onclick="clearFilter()">Limpar</button>
      <button class="btn small secondary" onclick="exportDashXLSX()">⬇️ XLSX</button>
      <button class="btn small secondary" onclick="exportDashPDF()">⬇️ PDF</button></div>
    </div>
    <div id="dashContent"></div>`;
  ["fc","ff","fi","fim","fa"].forEach(id=>{const el=$("#"+id); if(el) el.onchange=onFilter;});

function onFilter(){
  A.filters={consultor:$("#fc").value,fazenda:$("#ff").value,ini:$("#fi").value,fim:$("#fim").value,adub:$("#fa").value};
  drawDash();
}
function clearFilter(){ A.filters={consultor:"",fazenda:"",ini:"",fim:"",adub:""};
  ["fc","ff","fa"].forEach(i=>$("#"+i).value=""); ["fi","fim"].forEach(i=>$("#"+i).value=""); drawDash(); }

function drawDash(){
  const d=A.data; const vis=applyFilters(d.vis);
  // KPIs período
  const total=vis.length;
  const consultoresAtivos=new Set(vis.map(v=>v.consultor)).size;
  const fazVisit=new Set(vis.map(v=>v.fazenda_id)).size;
  // comparação período anterior (mesma janela deslocada) se datas informadas
  let deltaHtml="";
  if(A.filters.ini && A.filters.fim){
    const ini=new Date(A.filters.ini), fim=new Date(A.filters.fim);
    const span=fim-ini; const pIni=new Date(ini-span), pFim=new Date(ini-1);
    const prev=d.vis.filter(v=>{const t=new Date(v.inicio_em); return t>=pIni&&t<=pFim
      && (!A.filters.consultor||v.consultor===A.filters.consultor)
      && (!A.filters.fazenda||v.fazenda===A.filters.fazenda)
      && (!A.filters.adub||String(v.tipo_adub||"").split("+").includes(A.filters.adub));}).length;
    const diff=total-prev; const sign=diff>=0?"▲":"▼"; const col=diff>=0?"var(--ok)":"var(--danger)";
    deltaHtml=`<div class="d" style="color:${col}">${sign} ${Math.abs(diff)} vs. período anterior (${prev})</div>`;
  }
  // Fazendas não visitadas (no período): total de fazendas - visitadas
  const totalFaz=d.faz.length;
  const naoVisit=totalFaz-fazVisit;
  const pctNao=totalFaz?((naoVisit/totalFaz)*100).toFixed(0):0;

  // NPK filtrado
  const npk=d.npk.filter(x=>(!A.filters.fazenda||x.fazenda===A.filters.fazenda)
    && (!A.filters.adub||String(x.tipo_adub||"").split("+").includes(A.filters.adub))
    && (!A.filters.ini||x.ano_mes>=A.filters.ini.slice(0,7))
    && (!A.filters.fim||x.ano_mes<=A.filters.fim.slice(0,7)));
  A._npk = npk; // base para o painel 11.4 (visão geral / por fazenda)

  // NPK APLICADO filtrado (mesma base do Recomendado) — o painel 11.4 Aplicado
  // passa a respeitar a MESMA visão (por fazenda / média geral) e filtro de fazendas.
  const npkap=(d.npkap||[]).filter(x=>(!A.filters.fazenda||x.fazenda===A.filters.fazenda)
    && (!A.filters.ini||!x.ano_mes||String(x.ano_mes)>=A.filters.ini.slice(0,7))
    && (!A.filters.fim||!x.ano_mes||String(x.ano_mes)<=A.filters.fim.slice(0,7)));
  A._npkap = npkap;

  $("#dashContent").innerHTML=`
    <div class="section-title">Visão geral</div>
    <div class="kpis">
      <div class="kpi"><div class="v">${total}</div><div class="l">Visitas no período</div>${deltaHtml}</div>
      <div class="kpi"><div class="v">${naoVisit}</div><div class="l">Fazendas não visitadas</div><div class="d">${pctNao}% do total (${totalFaz})</div></div>
      <div class="kpi"><div class="v">${consultoresAtivos}</div><div class="l">Consultores ativos</div></div>
      <div class="kpi"><div class="v">${fazVisit}</div><div class="l">Fazendas visitadas</div></div>
      <div class="kpi"><div class="v">${d.kpi.evidencias_total||0}</div><div class="l">Evidências (total)</div></div>
      <div class="kpi"><div class="v">${d.kpi.media_visitas_por_consultor||0}</div><div class="l">Média visitas/consultor</div></div>
    </div>

    <div class="section-title">11.1 · Visitas ao longo do tempo</div>
    <div class="card"><div class="chartbox"><canvas id="chTempo"></canvas></div></div>

    <div class="section-title">11.1 · Ranking de visitas por consultor</div>
    <div class="card"><div class="chartbox"><canvas id="chRank"></canvas></div></div>

function tableCF(vis){
  const m={}; vis.forEach(v=>{const k=v.consultor+"||"+v.fazenda; m[k]=(m[k]||0)+1;});
  const rows=Object.entries(m).map(([k,n])=>{const[c,f]=k.split("||");return[c,f,n];})
    .sort((a,b)=>b[2]-a[2]);
  return rows.length?rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")
    :`<tr><td colspan="3" class="hint">Sem visitas no filtro.</td></tr>`;
}
function toggleNaoVisit(btn){
  const card=$("#naoVisitCard"); if(!card) return;
  const hidden=card.classList.toggle("hidden");
  btn.textContent=hidden?"Mostrar":"Ocultar";
}
function tableNaoVisit(st){
  const rows=st.filter(s=>s.ultima_visita===null || s.dias_sem_visita>ALERTA_DIAS)
    .sort((a,b)=>(b.dias_sem_visita||9999)-(a.dias_sem_visita||9999));
  return rows.length?rows.map(s=>{
    const alert=s.ultima_visita===null||s.dias_sem_visita>ALERTA_DIAS;
    return `<tr style="${alert?'background:#fff6f4':''}">
      <td>${s.fazenda}</td><td>${s.consultor_responsavel||"—"}</td>
      <td>${s.ultima_visita?fmtDay(s.ultima_visita):'<span class="badge dang">nunca</span>'}</td>
      <td>${s.dias_sem_visita!=null?`<span class="badge ${s.dias_sem_visita>ALERTA_DIAS?'dang':'ok'}">${s.dias_sem_visita}</span>`:"—"}</td></tr>`;
  }).join(""):`<tr><td colspan="4" class="hint">Todas as fazendas visitadas dentro do prazo. 🎉</td></tr>`;
}
/* Média dos lançamentos ≠ 0 (cada nutriente conta apenas registros > 0).
   byFarm=true  -> agrega por fazenda + tipo de adubação (linhas).
   byFarm=false -> agrega tudo em um único resultado (média geral). */
function npkAggregate(rows, byFarm){
  const acc=(o,vn,vp,vk)=>{ if(vn>0){o.nS+=vn;o.nC++;} if(vp>0){o.pS+=vp;o.pC++;} if(vk>0){o.kS+=vk;o.kC++;} };
  const mk=()=>({nS:0,nC:0,pS:0,pC:0,kS:0,kC:0});
  if(byFarm){
    const m={};
    rows.forEach(x=>{ const key=x.fazenda+"||"+x.tipo_adub;
      if(!m[key]) m[key]=Object.assign({f:x.fazenda,a:x.tipo_adub},mk());
      acc(m[key],+x.n_kg_ha,+x.p2o5_kg_ha,+x.k2o_kg_ha); });
    return Object.values(m).map(r=>({f:r.f,a:r.a,
      n:r.nC?r.nS/r.nC:0, p:r.pC?r.pS/r.pC:0, k:r.kC?r.kS/r.kC:0}));
  } else {
    const o=mk(); rows.forEach(x=>acc(o,+x.n_kg_ha,+x.p2o5_kg_ha,+x.k2o_kg_ha));
    return {n:o.nC?o.nS/o.nC:0, p:o.pC?o.pS/o.pC:0, k:o.kC?o.kS/o.kC:0};
  }
}
/* Média dos lançamentos ≠ 0 agregada SOMENTE por fazenda (o Aplicado não tem
   tipo de adubação). Mesma regra do Recomendado, garantindo comparabilidade. */
function npkAggregateFarmOnly(rows){
  const m={};
  rows.forEach(x=>{ const f=x.fazenda;
    if(!m[f]) m[f]={f, nS:0,nC:0,pS:0,pC:0,kS:0,kC:0};
    const o=m[f], vn=+x.n_kg_ha, vp=+x.p2o5_kg_ha, vk=+x.k2o_kg_ha;
    if(vn>0){o.nS+=vn;o.nC++;} if(vp>0){o.pS+=vp;o.pC++;} if(vk>0){o.kS+=vk;o.kC++;} });
  return Object.values(m).map(r=>({f:r.f,
    n:r.nC?r.nS/r.nC:0, p:r.pC?r.pS/r.pC:0, k:r.kC?r.kS/r.kC:0}));
}
/* Renderiza o painel 11.4 conforme a visão (por fazenda / média geral) e o
   filtro de fazendas do próprio painel. Base: A._npk (já filtrado no global). */
function renderNPK114(){
  const cont=$("#npk114"); if(!cont) return;
  const view=$("#npkView")?.value||"fazenda";
  const fsel=$("#npkFaz")?[...$("#npkFaz").selectedOptions].map(o=>o.value):[];
  let rows=(A._npk||[]);
  if(fsel.length) rows=rows.filter(x=>fsel.includes(x.fazenda));
  try{ A.charts.npk?.destroy(); }catch(e){}

  if(view==="geral"){
    const g=npkAggregate(rows,false);
    cont.innerHTML=`
      <div class="card"><div class="chartbox"><canvas id="chNPK"></canvas></div></div>
      <div class="kpis">
        <div class="kpi"><div class="v">${g.n.toFixed(1)}</div><div class="l">N médio (kg/ha)</div></div>
        <div class="kpi"><div class="v">${g.p.toFixed(1)}</div><div class="l">P₂O₅ médio (kg/ha)</div></div>
        <div class="kpi"><div class="v">${g.k.toFixed(1)}</div><div class="l">K₂O médio (kg/ha)</div></div>
      </div>
      <p class="hint">${fsel.length?`Média geral de ${fsel.length} fazenda(s) selecionada(s).`:"Média geral de todas as fazendas do filtro."}</p>`;
    A.charts.npk=new Chart($("#chNPK"),{type:"bar",
      data:{labels:["N","P₂O₅","K₂O"],datasets:[{label:"Média (kg/ha)",
        data:[g.n,g.p,g.k],backgroundColor:["#2d6cdf","#8e44ad","#e08e0b"]}]},
      options:{...chartOpts(),plugins:{legend:{display:false}}}});
  } else {
    const rr=npkAggregate(rows,true);
    const tbody = rr.length
      ? rr.map(r=>`<tr><td>${r.f}</td><td>${adubLabel(r.a)}</td>
          <td>${r.n.toFixed(1)}</td><td>${r.p.toFixed(1)}</td><td>${r.k.toFixed(1)}</td></tr>`).join("")
      : `<tr><td colspan="5" class="hint">Sem dados de nutrição no filtro.</td></tr>`;
    cont.innerHTML=`
      <div class="card"><div class="chartbox"><canvas id="chNPK"></canvas></div></div>
      <div class="card tablewrap"><table>
        <thead><tr><th>Fazenda</th><th>Adub.</th><th>N</th><th>P₂O₅</th><th>K₂O</th></tr></thead>
        <tbody>${tbody}</tbody></table></div>`;
    // gráfico: média por fazenda (soma dos tipos de adubação da mesma fazenda p/ visualização)
    const byF={}; rr.forEach(r=>{ if(!byF[r.f])byF[r.f]={n:0,p:0,k:0};
      byF[r.f].n+=r.n; byF[r.f].p+=r.p; byF[r.f].k+=r.k; });
    const fl=Object.keys(byF).slice(0,12);
    A.charts.npk=new Chart($("#chNPK"),{type:"bar",
      data:{labels:fl,datasets:[
        {label:"N",data:fl.map(f=>byF[f].n),backgroundColor:"#2d6cdf"},
        {label:"P₂O₅",data:fl.map(f=>byF[f].p),backgroundColor:"#8e44ad"},
        {label:"K₂O",data:fl.map(f=>byF[f].k),backgroundColor:"#e08e0b"}]},
      options:chartOpts()});
  }
  // O painel Aplicado acompanha a mesma visão/seleção de fazendas do Recomendado.
  renderNPKap114();
}
/* Painel 11.4 · NPK APLICADO — espelha a visão (por fazenda / média geral) e o
   filtro de fazendas do Recomendado. Na média geral, mostra também "% do
   recomendado" (quanto o produtor de fato segue). Base: A._npkap. */
function renderNPKap114(){
  const cont=$("#npkAp114"); if(!cont) return;
  const view=$("#npkView")?.value||"fazenda";
  const fsel=$("#npkFaz")?[...$("#npkFaz").selectedOptions].map(o=>o.value):[];
  let rows=(A._npkap||[]);
  if(fsel.length) rows=rows.filter(x=>fsel.includes(x.fazenda));
  try{ A.charts.npkap?.destroy(); }catch(e){}

  if(view==="geral"){
    const g=npkAggregate(rows,false);
    // recomendado na mesma base (para calcular a adesão % em cada nutriente)
    let recRows=(A._npk||[]); if(fsel.length) recRows=recRows.filter(x=>fsel.includes(x.fazenda));
    const gr=npkAggregate(recRows,false);
    const pct=(a,b)=> (b>0 ? (a/b*100) : null);
    const fmtPct=v=> (v==null ? "—" : v.toFixed(0)+"%");
    cont.innerHTML=`
      <div class="card"><div class="chartbox"><canvas id="chNPKap"></canvas></div></div>
      <div class="kpis">
        <div class="kpi"><div class="v">${g.n.toFixed(1)}</div><div class="l">N médio aplicado (kg/ha)</div><div class="d">${fmtPct(pct(g.n,gr.n))} do recomendado</div></div>
        <div class="kpi"><div class="v">${g.p.toFixed(1)}</div><div class="l">P₂O₅ médio aplicado (kg/ha)</div><div class="d">${fmtPct(pct(g.p,gr.p))} do recomendado</div></div>
        <div class="kpi"><div class="v">${g.k.toFixed(1)}</div><div class="l">K₂O médio aplicado (kg/ha)</div><div class="d">${fmtPct(pct(g.k,gr.k))} do recomendado</div></div>
      </div>
      <p class="hint">${fsel.length?`Média geral de ${fsel.length} fazenda(s) selecionada(s).`:"Média geral de todas as fazendas do filtro."} “% do recomendado” indica o quanto os produtores seguem a recomendação.</p>`;
    A.charts.npkap=new Chart($("#chNPKap"),{type:"bar",
      data:{labels:["N","P₂O₅","K₂O"],datasets:[
        {label:"Recomendado (kg/ha)",data:[gr.n,gr.p,gr.k],backgroundColor:"#9db4cd"},
        {label:"Aplicado (kg/ha)",data:[g.n,g.p,g.k],backgroundColor:["#2d6cdf","#8e44ad","#e08e0b"]}]},
      options:chartOpts()});
  } else {
    const rr=npkAggregateFarmOnly(rows);
    const tbody = rr.length
      ? rr.map(r=>`<tr><td>${r.f}</td><td>${r.n.toFixed(1)}</td><td>${r.p.toFixed(1)}</td><td>${r.k.toFixed(1)}</td></tr>`).join("")
      : `<tr><td colspan="4" class="hint">Sem NPK aplicado registrado na adesão.</td></tr>`;
    cont.innerHTML=`
      <div class="card"><div class="chartbox"><canvas id="chNPKap"></canvas></div></div>
      <div class="card tablewrap"><table>
        <thead><tr><th>Fazenda</th><th>N</th><th>P₂O₅</th><th>K₂O</th></tr></thead>
        <tbody>${tbody}</tbody></table></div>`;
    const fl=rr.map(r=>r.f).slice(0,12);
    const byF={}; rr.forEach(r=>byF[r.f]=r);
    A.charts.npkap=new Chart($("#chNPKap"),{type:"bar",
      data:{labels:fl,datasets:[
        {label:"N",data:fl.map(f=>byF[f].n),backgroundColor:"#2d6cdf"},
        {label:"P₂O₅",data:fl.map(f=>byF[f].p),backgroundColor:"#8e44ad"},
        {label:"K₂O",data:fl.map(f=>byF[f].k),backgroundColor:"#e08e0b"}]},
      options:chartOpts()});
  }
}
function miniTable(rows,keys,heads){
  if(!rows.length) return `<p class="hint">—</p>`;
  return `<table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
    rows.slice(0,10).map(r=>`<tr>${keys.map(k=>`<td>${r[k]}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

function drawCharts(vis,d,npk){
  Object.values(A.charts).forEach(c=>{try{c.destroy()}catch(e){}}); A.charts={};
  const green="#1b3a5b", soft="#9db4cd";
  // tempo (por mês)
  const byMonth={}; vis.forEach(v=>{byMonth[v.ano_mes]=(byMonth[v.ano_mes]||0)+1;});
  const meses=Object.keys(byMonth).sort();
  A.charts.tempo=new Chart($("#chTempo"),{type:"line",
    data:{labels:meses,datasets:[{label:"Visitas",data:meses.map(m=>byMonth[m]),
      borderColor:green,backgroundColor:"rgba(27,58,91,.12)",fill:true,tension:.3}]},
    options:chartOpts()});
  // ranking consultor
  const byC={}; vis.forEach(v=>{byC[v.consultor]=(byC[v.consultor]||0)+1;});
  const cs=Object.entries(byC).sort((a,b)=>b[1]-a[1]);
  A.charts.rank=new Chart($("#chRank"),{type:"bar",
    data:{labels:cs.map(c=>c[0]),datasets:[{label:"Visitas",data:cs.map(c=>c[1]),backgroundColor:green}]},
    options:chartOpts(true)});
  // obs
  A.charts.obs=new Chart($("#chObs"),{type:"bar",
    data:{labels:d.obs.map(o=>o.categoria),datasets:[{data:d.obs.map(o=>o.ocorrencias),backgroundColor:soft}]},
    options:{...chartOpts(true),plugins:{legend:{display:false}}}});
  // adesão — Efetiva / Desvio (substituição) / Não seguiu
  const efe=d.ade.reduce((a,x)=>a+ (+x.efetivas||0),0);
  const des=d.ade.reduce((a,x)=>a+ (+x.desvios||0),0);
  const tot=d.ade.reduce((a,x)=>a+ (+x.total||0),0);
  const nao=Math.max(tot-efe-des,0);
  A.charts.ade=new Chart($("#chAde"),{type:"doughnut",
    data:{labels:["Adesão efetiva","Desvio (substituição)","Não seguiu"],
      datasets:[{data:[efe,des,nao],backgroundColor:[green,"#d9822b","#e2b4ab"]}]},
    options:{responsive:true,maintainAspectRatio:false}});
  // NPK RECOMENDADO e APLICADO (11.4) são renderizados por renderNPK114()/renderNPKap114(),
  // pois ambos passam a respeitar a mesma visão (por fazenda / média geral).
}
function chartOpts(horizontalHint){
  return {responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:"#12261f"}}},
    scales:{x:{ticks:{color:"#5b6b64",maxRotation:60,minRotation:0}},
            y:{ticks:{color:"#5b6b64"},beginAtZero:true}}};
}
